name: Deploy Production Cloud Run

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag, or SHA to deploy
        required: false
        default: main
      service:
        description: Cloud Run service name
        required: false
        default: tracking-preview-api
      region:
        description: Google Cloud region
        required: false
        default: asia-south1

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cloud-run-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify production backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: ${{ inputs.service || 'tracking-preview-api' }}
      REGION: ${{ inputs.region || 'asia-south1' }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || 'main' }}
          fetch-depth: 0

      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROJECT_ID:-}" || {
            echo "::error::Repository variable GCP_PROJECT_ID is required."
            exit 1
          }
          test -f Dockerfile
          grep -F 'COPY backend/ /app/' Dockerfile >/dev/null
          grep -F 'uvicorn server:app' Dockerfile >/dev/null
          echo "Candidate SHA: $(git rev-parse HEAD)"
          echo "Project: $PROJECT_ID"
          echo "Service: $SERVICE"
          echo "Region: $REGION"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify active Google Cloud identity and target service
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test -n "$ACTIVE_ACCOUNT"
          echo "Active account: $ACTIVE_ACCOUNT"
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='yaml(metadata.name,status.url,status.latestReadyRevisionName)' | tee /tmp/service-before.yaml

      - name: Deploy candidate from repository Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SHA:0:12}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source . \
            --platform managed \
            --quiet \
            --update-labels="source-sha=${SHORT_SHA},managed-by=github-actions"

      - name: Resolve deployed service URL and revision
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$URL"
          test -n "$REVISION"
          echo "DEPLOYED_URL=$URL" >> "$GITHUB_ENV"
          echo "DEPLOYED_REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "Deployed URL: $URL"
          echo "Ready revision: $REVISION"

      - name: Verify health and public policy routes
        shell: bash
        run: |
          set -euo pipefail
          for path in /health /api/health /privacy_policy /terms /account-deletion; do
            code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/response -w '%{http_code}' "${DEPLOYED_URL}${path}")"
            echo "$path -> HTTP $code"
            test "$code" = "200" || { cat /tmp/response; exit 1; }
            case "$path" in
              /health|/api/health)
                grep -F 'healthy' /tmp/response >/dev/null || { cat /tmp/response; exit 1; }
                ;;
            esac
          done

      - name: Verify deployed revision is Ready
        shell: bash
        run: |
          set -euo pipefail
          READY="$(gcloud run revisions describe "$DEPLOYED_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.conditions[0].status)')"
          test "$READY" = "True"
          gcloud run revisions describe "$DEPLOYED_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='yaml(metadata.name,metadata.labels,status.conditions,status.imageDigest)'

      - name: Probe canonical public host
        shell: bash
        run: |
          set -euo pipefail
          echo "Cloud Run is verified above. Probing trackmyrmc.com separately for routing drift."
          failed=0
          for path in /privacy_policy /terms /account-deletion; do
            code="$(curl -L --max-redirs 5 -sS -o /tmp/domain-response -w '%{http_code}' "https://trackmyrmc.com${path}" || true)"
            echo "https://trackmyrmc.com${path} -> HTTP ${code:-request-failed}"
            if [ "$code" != "200" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::warning::Cloud Run deployed correctly, but one or more canonical-domain routes are not HTTP 200. Check DNS/load-balancer/CDN/origin routing for trackmyrmc.com."
          fi
