name: Deploy Current Production Backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy-production-cloud-run.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: current-production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify current production backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # This is the single current production GCP project. The project ID and
      # service name are historical/immutable identifiers for the live stack.
      PROJECT_ID: tracking-project-preview
      SERVICE: tracking-preview-api
      REGION: asia-south1
      PRODUCTION_HOST: trackmyrmc.com
      # Public Google Play app-signing certificate fingerprint. This is the
      # certificate Google Play uses on installed APKs and therefore the one
      # Android App Links must publish from /.well-known/assetlinks.json.
      PLAY_APP_SIGNING_SHA256: "94:19:46:02:2E:2E:BF:55:5E:71:1B:63:33:99:87:C6:91:A2:21:43:B8:5C:34:97:31:D0:FC:E6:C2:AC:62:D4"

    steps:
      - name: Checkout main production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Enforce single production target
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "tracking-project-preview"
          test "$SERVICE" = "tracking-preview-api"
          test "$REGION" = "asia-south1"
          git fetch origin main --no-tags --prune
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || {
            echo "::error::Production deployment is allowed only for commits already on main."
            exit 1
          }
          echo "Production candidate: $(git rev-parse HEAD)"
          echo "Pinned project: $PROJECT_ID"
          echo "Pinned service: $SERVICE"
          echo "Pinned region: $REGION"

      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          grep -F 'COPY backend/ /app/' Dockerfile >/dev/null
          grep -F 'uvicorn server:app' Dockerfile >/dev/null
          test -n "$PLAY_APP_SIGNING_SHA256"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify pinned Google Cloud target exists
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test -n "$ACTIVE_ACCOUNT"
          echo "Active account: $ACTIVE_ACCOUNT"
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='yaml(metadata.name,status.url,status.latestReadyRevisionName)'

      - name: Deploy candidate from repository Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SHA:0:12}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source . \
            --platform managed \
            --quiet \
            --update-env-vars="PLAY_SIGNING_SHA256=${PLAY_APP_SIGNING_SHA256}" \
            --update-labels="source-sha=${SHORT_SHA},managed-by=github-actions,component=backend,deployment-tier=production"

      - name: Resolve deployed service URL and revision
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$URL"
          test -n "$REVISION"
          echo "DEPLOYED_URL=$URL" >> "$GITHUB_ENV"
          echo "DEPLOYED_REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "Deployed URL: $URL"
          echo "Ready revision: $REVISION"

      - name: Verify production backend routes
        shell: bash
        run: |
          set -euo pipefail
          for path in /health /api/health /privacy_policy /terms /account-deletion; do
            code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/response -w '%{http_code}' "${DEPLOYED_URL}${path}")"
            echo "$path -> HTTP $code"
            test "$code" = "200" || { cat /tmp/response; exit 1; }
            case "$path" in
              /health|/api/health)
                grep -F 'healthy' /tmp/response >/dev/null || { cat /tmp/response; exit 1; }
                ;;
            esac
          done

          code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -o /tmp/assetlinks -w '%{http_code}' "${DEPLOYED_URL}/.well-known/assetlinks.json")"
          echo "/.well-known/assetlinks.json -> HTTP $code"
          test "$code" = "200" || { cat /tmp/assetlinks; exit 1; }
          grep -F 'com.trackmyrmc.concreteking' /tmp/assetlinks >/dev/null || { cat /tmp/assetlinks; exit 1; }
          grep -F "$PLAY_APP_SIGNING_SHA256" /tmp/assetlinks >/dev/null || {
            echo "::error::assetlinks.json does not contain the Google Play app-signing SHA-256"
            cat /tmp/assetlinks
            exit 1
          }

      - name: Verify deployed revision is Ready
        shell: bash
        run: |
          set -euo pipefail
          READY="$(gcloud run revisions describe "$DEPLOYED_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.conditions[0].status)')"
          test "$READY" = "True"
          gcloud run revisions describe "$DEPLOYED_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='yaml(metadata.name,metadata.labels,status.conditions,status.imageDigest)'

      - name: Verify canonical production API
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -L -sS -o /tmp/domain-response -w '%{http_code}' "https://${PRODUCTION_HOST}/api/health")"
          echo "https://${PRODUCTION_HOST}/api/health -> HTTP $code"
          test "$code" = "200" || { cat /tmp/domain-response; exit 1; }
          grep -F 'healthy' /tmp/domain-response >/dev/null || { cat /tmp/domain-response; exit 1; }

          code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -L -sS -o /tmp/domain-assetlinks -w '%{http_code}' "https://${PRODUCTION_HOST}/.well-known/assetlinks.json")"
          echo "https://${PRODUCTION_HOST}/.well-known/assetlinks.json -> HTTP $code"
          test "$code" = "200" || { cat /tmp/domain-assetlinks; exit 1; }
          grep -F "$PLAY_APP_SIGNING_SHA256" /tmp/domain-assetlinks >/dev/null || {
            echo "::error::Canonical assetlinks.json does not contain the Google Play app-signing SHA-256"
            cat /tmp/domain-assetlinks
            exit 1
          }
