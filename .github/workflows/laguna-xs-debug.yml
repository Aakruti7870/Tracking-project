name: Laguna XS 2.1 Coding Debugger

on:
  push:
    branches:
      - feat/laguna-xs-agent
    paths:
      - ".github/workflows/laguna-xs-debug.yml"

  workflow_dispatch:
    inputs:
      file_path:
        description: "Repository file for Laguna to inspect"
        required: true
        default: "backend/server.py"
      task:
        description: "Coding/debugging task"
        required: true
        default: "Audit this file for concrete bugs, security issues, broken contracts, race conditions, or maintainability risks. Propose the smallest production-safe patch and exact tests required."

permissions:
  contents: read

jobs:
  laguna-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze code with Laguna XS 2.1
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LAGUNA_MODEL: ${{ vars.LAGUNA_MODEL }}
          LAGUNA_FILE: ${{ github.event.inputs.file_path || 'backend/server.py' }}
          LAGUNA_TASK: ${{ github.event.inputs.task || 'Audit this file for concrete bugs, security issues, broken contracts, race conditions, or maintainability risks. Propose the smallest production-safe patch and exact tests required.' }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          api_key = os.environ.get("NVIDIA_API_KEY")
          model = os.environ.get("LAGUNA_MODEL")
          file_name = os.environ.get("LAGUNA_FILE", "backend/server.py")
          task = os.environ.get("LAGUNA_TASK", "Audit this file and propose a safe patch.")

          if not api_key:
              raise SystemExit("NVIDIA_API_KEY is missing")
          if not model:
              raise SystemExit("LAGUNA_MODEL is missing")

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target = (workspace / file_name).resolve()

          try:
              target.relative_to(workspace)
          except ValueError:
              raise SystemExit("Blocked: file must be inside the repository")

          blocked = (
              ".env",
              "secret",
              "credentials",
              ".pem",
              ".p12",
              ".jks",
              "keystore",
              "google-services.json",
          )
          lower_path = str(target).lower()
          if any(item in lower_path for item in blocked):
              raise SystemExit("Blocked: potentially sensitive file")

          if not target.is_file():
              raise SystemExit(f"File not found: {file_name}")
          if target.stat().st_size > 160_000:
              raise SystemExit("File too large for this guarded single-file debug workflow")

          source = target.read_text(encoding="utf-8", errors="replace")

          system_prompt = """
          You are Laguna XS 2.1 acting as the TrackMyRMC coding and debugging specialist.

          Operating rules:
          - Find concrete, evidence-based defects; do not invent missing behavior.
          - Preserve authentication, authorization, KYC, payment, order, tracking, payroll, API and database contracts unless the task explicitly requires a contract change.
          - Prefer the smallest production-safe patch over broad rewrites.
          - Treat user input, file uploads, external callbacks, tokens, secrets, locations and privileged actions as security-sensitive.
          - Distinguish proven bugs from hypotheses.
          - Do not claim tests passed. You are receiving source only in this workflow.
          - Do not expose, request, or guess secrets.
          - Do not modify the repository in this workflow. Return reviewable patch guidance only.
          - For Python, TypeScript, Kotlin or Java, use idiomatic language/platform patterns rather than mechanical translation.
          """

          user_prompt = f"""
          TASK:
          {task}

          FILE:
          {file_name}

          SOURCE:
          --- BEGIN SOURCE ---
          {source}
          --- END SOURCE ---

          Return exactly these sections:
          ## Verdict
          ## Proven Findings
          ## Risk Ranking
          ## Minimal Production-Safe Patch
          ## Tests To Add Or Run
          ## Regression Risks
          ## Files Needed For Cross-Check
          ## Final Recommendation
          """

          payload = {
              "model": model,
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt},
              ],
              "temperature": 0.1,
              "max_tokens": 6000,
              "stream": False,
          }

          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Laguna API request failed: HTTP {exc.code}\n{body[:1200]}")

          try:
              answer = result["choices"][0]["message"]["content"]
          except Exception:
              raise SystemExit("Unexpected Laguna response format")

          if not answer:
              raise SystemExit("Laguna returned an empty response")

          pathlib.Path("laguna-debug-analysis.md").write_text(answer, encoding="utf-8")

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as fh:
                  fh.write("# Laguna XS 2.1 Coding Debug Report\n\n")
                  fh.write(f"**File:** `{file_name}`\n\n")
                  fh.write(answer)
                  fh.write("\n")

          print("Laguna XS 2.1 code analysis completed successfully.")
          PY
