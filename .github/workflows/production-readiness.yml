name: Production readiness

on:
  pull_request:
  push:
    branches: [codex/production-hardening-parallel]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: corepack enable && yarn install
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: npx expo config --type public
      - run: npx expo-doctor

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Reject private material
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | awk 'BEGIN{IGNORECASE=1} /(^|\/)\.env($|\.)|\.(pem|key|keystore)$|(^|\/)(credentials|service-account)[^\/]*\.json$/')
          if [ -n "$bad" ]; then
            echo "Forbidden credential-like files are tracked:" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
