name: Production Readiness

on:
  push:
    branches:
      - main
      - fix/production-readiness-final
      - fix/tracking-project-100-percent
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend API + security tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: trackmyrmc_ci
      JWT_SECRET: ci-only-trackmyrmc-jwt-secret-not-for-production-32chars
      OTP_PEPPER: ci-only-trackmyrmc-otp-pepper-not-for-production-32chars
      DEBUG_OTP: "true"
      OTP_RESEND_SECONDS: "1"
      CORS_ORIGINS: http://127.0.0.1:8081
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      STORAGE_MODE: local
      LOCAL_STORAGE_DIR: /tmp/trackmyrmc-storage
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements-ci.txt
      - name: Python import/compile validation
        run: python -m compileall -q backend
      - name: Focused production-hardening unit tests
        working-directory: backend
        run: pytest -n 0 -q tests/test_production_hardening_unit.py tests/test_runtime_config_unit.py tests/test_business_domain_unit.py
      - name: Start TrackMyRMC API
        working-directory: backend
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/trackmyrmc-api.log 2>&1 &
          echo $! > /tmp/trackmyrmc-api.pid
      - name: Wait for health
        run: |
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/root-health.json && curl -fsS http://127.0.0.1:8000/api/health >/tmp/health.json; then
              cat /tmp/root-health.json
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/trackmyrmc-api.log || true
          exit 1
      - name: Full backend integration suite
        working-directory: backend
        shell: bash
        run: |
          set +e
          pytest -n 0 -q --tb=short --junitxml=/tmp/backend-pytest.xml > /tmp/backend-pytest.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "--- backend pytest failure summary ---"
            tail -n 260 /tmp/backend-pytest.log
          else
            cat /tmp/backend-pytest.log
          fi
          exit $status
      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            /tmp/backend-pytest.xml
            /tmp/backend-pytest.log
            /tmp/trackmyrmc-api.log
          if-no-files-found: warn
          retention-days: 7
      - name: API log on failure
        if: failure()
        run: tail -n 200 /tmp/trackmyrmc-api.log || true

  frontend:
    name: Expo typecheck + lint + config + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.PREVIEW_BACKEND_URL || 'https://api.example.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify preview backend if configured
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EXPO_PUBLIC_BACKEND_URL" = "https://api.example.invalid" ]; then
            echo "::notice::PREVIEW_BACKEND_URL is not configured; running build-only validation."
            exit 0
          fi
          curl -fsS "$EXPO_PUBLIC_BACKEND_URL/api/health" >/tmp/preview-health.json
          cat /tmp/preview-health.json
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Expo Doctor
        working-directory: frontend
        run: npm run doctor
      - name: Validate public Expo config
        working-directory: frontend
        run: npx expo config --type public >/tmp/expo-config.txt && test -s /tmp/expo-config.txt
      - name: Build Expo web preview
        working-directory: frontend
        run: npm run build:preview

  android-native:
    name: Android standalone preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.PREVIEW_BACKEND_URL || 'https://api.example.invalid' }}
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify preview backend if configured
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EXPO_PUBLIC_BACKEND_URL" = "https://api.example.invalid" ]; then
            echo "::notice::PREVIEW_BACKEND_URL is not configured; compiling Android only."
            exit 0
          fi
          curl -fsS "$EXPO_PUBLIC_BACKEND_URL/api/health" >/tmp/preview-health.json
          cat /tmp/preview-health.json
      - name: Generate Android native project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify Android identity and version
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          gradle_file=$(find android/app -maxdepth 1 -type f -name 'build.gradle*' | head -n 1)
          test -n "$gradle_file"
          grep -F "com.trackmyrmc.concreteking" "$gradle_file" >/dev/null || {
            echo "Expected Android applicationId com.trackmyrmc.concreteking was not generated"
            exit 1
          }
          grep -E "versionCode[[:space:]=]+67" "$gradle_file" >/dev/null || {
            echo "Expected Android versionCode 67 was not generated"
            exit 1
          }
      - name: Compile standalone release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify standalone APK contains JavaScript bundle and signature
        working-directory: frontend/android
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          unzip -l "$apk" | grep -F "assets/index.android.bundle" >/dev/null || {
            echo "Standalone APK is missing assets/index.android.bundle"
            exit 1
          }
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
      - name: Upload standalone Android preview APK
        if: env.EXPO_PUBLIC_BACKEND_URL != 'https://api.example.invalid'
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-2.0.9-vc67-standalone-preview-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  repository-security:
    name: Repository secret/signing guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked secret/signing file types
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env($|\.)|credentials\.json$|\.credentials($|/)|.*\.(key|pem|p12|pfx|jks|keystore)$)' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Tracked secret/signing files are forbidden:"
            echo "$bad"
            exit 1
          fi
      - name: Reject private key material in tracked text
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY-----' -- ':!*.md' ':!*.example'; then
            echo "Private key material detected in tracked files."
            exit 1
          fi
