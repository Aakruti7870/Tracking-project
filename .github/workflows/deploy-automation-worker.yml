name: Deploy Automation Worker

on:
  push:
    branches:
      - main
    paths:
      - backend/automation_worker.py
      - backend/automation_heartbeat.py
      - backend/order_automation.py
      - backend/automation_providers.py
      - backend/config.py
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy-automation-worker.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-automation-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify scheduled automation worker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT_ID: tracking-project-preview
      API_SERVICE: tracking-preview-api
      REGION: asia-south1
      WORKER_JOB: tracking-automation-worker
      SCHEDULER_JOB: tracking-automation-worker-every-minute

    steps:
      - name: Checkout main worker candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Enforce production main target
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "tracking-project-preview"
          test "$API_SERVICE" = "tracking-preview-api"
          test "$REGION" = "asia-south1"
          test -f backend/automation_worker.py
          git fetch origin main --no-tags --prune
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || {
            echo "::error::Automation worker deployment is allowed only for commits already on main."
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Cloud Scheduler API enabled
        shell: bash
        run: |
          set -euo pipefail
          ENABLED="$(gcloud services list \
            --project "$PROJECT_ID" \
            --enabled \
            --filter='config.name:cloudscheduler.googleapis.com' \
            --format='value(config.name)')"
          if [ "$ENABLED" = "cloudscheduler.googleapis.com" ]; then
            echo 'CLOUD_SCHEDULER_API_ENABLED=YES'
          else
            echo "::error::Cloud Scheduler API (cloudscheduler.googleapis.com) is not enabled for project ${PROJECT_ID}. The GitHub deploy service account intentionally lacks serviceusage.services.enable, so this workflow will not enable it automatically. An operator must enable it manually once by running: gcloud services enable cloudscheduler.googleapis.com --project ${PROJECT_ID}"
            exit 1
          fi

      - name: Capture live production runtime contract
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > /tmp/api-service.json
          python - <<'PY'
          import json
          from pathlib import Path

          svc = json.loads(Path('/tmp/api-service.json').read_text())
          spec = svc.get('spec', {}).get('template', {}).get('spec', {})
          containers = spec.get('containers') or svc.get('template', {}).get('containers') or []
          if not containers:
              raise SystemExit('production API container missing')
          sa = spec.get('serviceAccountName') or svc.get('template', {}).get('serviceAccount')
          if not sa:
              raise SystemExit('production runtime service account missing')
          Path('/tmp/runtime-sa').write_text(sa)
          PY

      - name: Build worker image from current main source
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$WORKER_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source . \
            --command python \
            --args automation_worker.py \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 10m \
            --quiet
          gcloud run jobs describe "$WORKER_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > /tmp/source-worker.json

      - name: Apply production env, secrets, identity and worker limits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          svc = json.loads(Path('/tmp/api-service.json').read_text())
          built = json.loads(Path('/tmp/source-worker.json').read_text())

          svc_spec = svc.get('spec', {}).get('template', {}).get('spec', {})
          svc_containers = svc_spec.get('containers') or svc.get('template', {}).get('containers') or []
          source_spec = built.get('spec', {}).get('template', {}).get('spec', {})
          source_task = source_spec.get('template', {}).get('spec', {})
          source_containers = source_task.get('containers') or []
          if not source_containers:
              raise SystemExit('built worker image missing')
          image = source_containers[0].get('image')
          if not image:
              raise SystemExit('built worker image reference missing')

          runtime_sa = Path('/tmp/runtime-sa').read_text().strip()
          env = list((svc_containers[0].get('env') if svc_containers else []) or [])
          worker_names = {
              'AUTOMATION_WORKER_BATCH_SIZE',
              'AUTOMATION_WORKER_MAX_EVENTS',
              'AUTOMATION_WORKER_LEASE_SECONDS',
              'AUTOMATION_WORKER_RETRY_SECONDS',
          }
          env = [row for row in env if row.get('name') not in worker_names]
          env.extend([
              {'name': 'AUTOMATION_WORKER_BATCH_SIZE', 'value': '10'},
              {'name': 'AUTOMATION_WORKER_MAX_EVENTS', 'value': '200'},
              {'name': 'AUTOMATION_WORKER_LEASE_SECONDS', 'value': '300'},
              {'name': 'AUTOMATION_WORKER_RETRY_SECONDS', 'value': '60'},
          ])

          manifest = {
              'apiVersion': 'run.googleapis.com/v1',
              'kind': 'Job',
              'metadata': {
                  'name': os.environ['WORKER_JOB'],
                  'labels': {
                      'component': 'automation-worker',
                      'managed-by': 'github-actions',
                      'deployment-tier': 'production',
                  },
              },
              'spec': {'template': {'spec': {
                  'taskCount': 1,
                  'template': {'spec': {
                      'containers': [{
                          'image': image,
                          'command': ['python'],
                          'args': ['automation_worker.py'],
                          'env': env,
                      }],
                      'maxRetries': 0,
                      'timeoutSeconds': '600',
                      'serviceAccountName': runtime_sa,
                  }},
              }}},
          }
          Path('/tmp/worker-job.json').write_text(json.dumps(manifest))
          PY

          gcloud run jobs replace /tmp/worker-job.json \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet >/dev/null

      - name: Note externally managed scheduler
        shell: bash
        run: |
          set -euo pipefail
          echo 'AUTOMATION_WORKER_SCHEDULER_MANAGEMENT=EXTERNAL'
          echo "The Cloud Scheduler trigger '${SCHEDULER_JOB}' is managed by an authorized operator, out of band."
          echo "This workflow performs no Cloud Scheduler API calls, so the GitHub deploy service account needs zero Cloud Scheduler permissions."
          echo "Operators create/update it with scripts/setup_automation_scheduler.sh and verify it with scripts/verify_automation_scheduler.sh (see docs/AUTOMATION_WORKER_OPERATIONS.md)."

      - name: Execute worker smoke run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$WORKER_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait \
            --quiet
          echo 'AUTOMATION_WORKER_SMOKE_RUN=PASS'
          # The worker writes its durable heartbeat (last_started_at / last_success_at)
          # as an integral part of every cycle and fails its execution if that write
          # fails. A green --wait smoke execution therefore proves the heartbeat path
          # works end to end against the production datastore.
          echo 'AUTOMATION_WORKER_HEARTBEAT=PASS'

      - name: Note scheduler invocation not verified in-pipeline
        shell: bash
        run: |
          set -euo pipefail
          # CI must never claim the scheduler is verified; only an authorized
          # operator with read-only Cloud Scheduler access can do that.
          echo 'AUTOMATION_SCHEDULER_VERIFIED=NO'
          echo "Scheduler invocation is verified out of band via scripts/verify_automation_scheduler.sh."
          echo "In production, heartbeat freshness (backend/automation_health.py) is the signal that the scheduler is actually invoking this worker."

      - name: Verify worker ready
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs describe "$WORKER_JOB" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > /tmp/deployed-worker.json
          RUNTIME_SA="$(cat /tmp/runtime-sa)"
          RUNTIME_SA="$RUNTIME_SA" python - <<'PY'
          import json
          import os
          from pathlib import Path

          job = json.loads(Path('/tmp/deployed-worker.json').read_text())
          expected_sa = os.environ['RUNTIME_SA'].strip()

          task_spec = (
              job.get('spec', {})
                 .get('template', {})
                 .get('spec', {})
                 .get('template', {})
                 .get('spec', {})
          )
          containers = task_spec.get('containers') or []
          if not containers:
              raise SystemExit('deployed worker has no container spec')
          container = containers[0]

          sa = task_spec.get('serviceAccountName')
          if sa != expected_sa:
              raise SystemExit(f'runtime service account mismatch: {sa!r} != {expected_sa!r}')

          command = container.get('command') or []
          args = container.get('args') or []
          if command != ['python'] or args != ['automation_worker.py']:
              raise SystemExit(f'worker entrypoint mismatch: command={command} args={args}')

          labels = job.get('metadata', {}).get('labels', {})
          if labels.get('component') != 'automation-worker':
              raise SystemExit(f'worker label mismatch: {labels!r}')

          print('AUTOMATION_WORKER_CONFIG=OK')
          print(f'AUTOMATION_WORKER_RUNTIME_SA={sa}')
          PY
          echo 'AUTOMATION_WORKER_DEPLOYED=YES'
          echo 'AUTOMATION_WORKER_SCHEDULE=* * * * * (managed externally via Cloud Scheduler)'
