name: Google Play Policy Readiness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-policy-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-gate:
    name: Play policy compliance gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Play policy invariants
        working-directory: frontend
        run: npm run check:play-policy

      - name: Typecheck consent and reviewer UI
        working-directory: frontend
        run: npm run typecheck

      - name: Compile backend policy modules
        run: |
          python -m py_compile \
            backend/config.py \
            backend/security.py \
            backend/play_review.py \
            backend/routers/play_review.py \
            backend/routers/public_policy.py \
            backend/server.py
