name: PR 135 Final Fix

on:
  push:
    branches:
      - feat/super-admin-production-readiness
    paths:
      - frontend/package.json
      - .github/workflows/pr135-final-fix.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/super-admin-production-readiness
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean npm install and js-yaml override
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm explain js-yaml > /tmp/js-yaml-explain.txt
          cat /tmp/js-yaml-explain.txt
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const bad = lock.packages?.['node_modules/@istanbuljs/load-nyc-config/node_modules/js-yaml'];
          if (bad && bad.version !== '4.3.0') {
            throw new Error(`load-nyc-config still resolves nested js-yaml ${bad.version}`);
          }
          const root = require('./package.json');
          if (root.overrides?.['@istanbuljs/load-nyc-config']?.['js-yaml'] !== '4.3.0') {
            throw new Error('npm override for load-nyc-config/js-yaml is missing');
          }
          console.log('JS_YAML_OVERRIDE_VERIFIED=PASS');
          NODE

      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          rm .github/workflows/pr135-final-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/pr135-final-fix.yml
          git diff --cached --check
          git commit -m "fix: regenerate npm lockfile for js-yaml override"
          git push origin HEAD:feat/super-admin-production-readiness
