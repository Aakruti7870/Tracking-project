name: Auth Routing Regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/otp-role-routing

permissions:
  contents: read

jobs:
  auth-routing:
    name: OTP + role routing guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - name: Verify OTP and authenticated role routing
        working-directory: frontend
        run: npm run check:auth-routing
