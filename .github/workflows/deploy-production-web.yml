name: Deploy Current Production Web

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/deploy-production-web.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: current-production-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify current production web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # This is the single current production GCP project. The project ID is
      # historical/immutable; do not redirect this workflow to another project.
      PROJECT_ID: tracking-project-preview
      SERVICE: tracking-web
      REGION: asia-south1
      PRODUCTION_HOST: trackmyrmc.com

    steps:
      - name: Checkout main production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Enforce single production target
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "tracking-project-preview"
          test "$SERVICE" = "tracking-web"
          test "$REGION" = "asia-south1"
          git fetch origin main --no-tags --prune
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || {
            echo "::error::Production deployment is allowed only for commits already on main."
            exit 1
          }
          echo "Production candidate: $(git rev-parse HEAD)"
          echo "Pinned project: $PROJECT_ID"
          echo "Pinned service: $SERVICE"
          echo "Pinned region: $REGION"

      - name: Verify web deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/Dockerfile
          test -f frontend/nginx.conf
          grep -F 'output": "single"' frontend/app.json >/dev/null
          grep -F 'EXPO_PUBLIC_BACKEND_URL=https://trackmyrmc.com' frontend/Dockerfile >/dev/null

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify pinned Google Cloud target exists
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test -n "$ACTIVE_ACCOUNT"
          echo "Active account: $ACTIVE_ACCOUNT"
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='yaml(metadata.name,status.url,status.latestReadyRevisionName)'

      - name: Deploy current Expo web app
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SHA:0:12}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source frontend \
            --platform managed \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 5 \
            --quiet \
            --update-labels="source-sha=${SHORT_SHA},managed-by=github-actions,component=web,deployment-tier=production"

      - name: Resolve web service URL and revision
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$URL"
          test -n "$REVISION"
          echo "WEB_URL=$URL" >> "$GITHUB_ENV"
          echo "WEB_REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "Web URL: $URL"
          echo "Ready revision: $REVISION"

      - name: Verify web revision is Ready
        shell: bash
        run: |
          set -euo pipefail
          READY="$(gcloud run revisions describe "$WEB_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.conditions[0].status)')"
          test "$READY" = "True"
          gcloud run revisions describe "$WEB_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='yaml(metadata.name,metadata.labels,status.conditions,status.imageDigest)'

      - name: Verify current production Cloud Run routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /login /api/health /privacy_policy /terms /account-deletion; do
            code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -L -sS -o /tmp/web-response -w '%{http_code}' "${WEB_URL}${path}")"
            echo "$path -> HTTP $code"
            test "$code" = "200" || { cat /tmp/web-response; exit 1; }
            test -s /tmp/web-response || { echo "Empty response for $path"; exit 1; }
          done

      - name: Verify canonical production domain
        shell: bash
        run: |
          set -euo pipefail
          for path in / /login /api/health /privacy_policy /terms /account-deletion; do
            code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -L -sS -o /tmp/domain-response -w '%{http_code}' "https://${PRODUCTION_HOST}${path}")"
            echo "https://${PRODUCTION_HOST}${path} -> HTTP $code"
            test "$code" = "200" || { cat /tmp/domain-response; exit 1; }
          done
          grep -F 'healthy' <(curl --retry 5 --retry-all-errors --retry-delay 2 -sS "https://${PRODUCTION_HOST}/api/health") >/dev/null
