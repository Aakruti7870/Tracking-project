name: Deploy Current Production Web

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/deploy-production-web.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: current-production-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify current production web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # This is the single current production GCP project. The project ID is
      # historical/immutable; do not redirect this workflow to another project.
      PROJECT_ID: tracking-project-preview
      SERVICE: tracking-web
      REGION: asia-south1
      PRODUCTION_HOST: trackmyrmc.com
      WWW_HOST: www.trackmyrmc.com

    steps:
      - name: Checkout main production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Enforce single production target
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "tracking-project-preview"
          test "$SERVICE" = "tracking-web"
          test "$REGION" = "asia-south1"
          git fetch origin main --no-tags --prune
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || {
            echo "::error::Production deployment is allowed only for commits already on main."
            exit 1
          }
          echo "Production candidate: $(git rev-parse HEAD)"
          echo "Pinned project: $PROJECT_ID"
          echo "Pinned service: $SERVICE"
          echo "Pinned region: $REGION"

      - name: Verify web deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/Dockerfile
          test -f frontend/nginx.conf
          test -f frontend/legacy-service-worker.js
          grep -F 'output": "single"' frontend/app.json >/dev/null
          grep -F 'EXPO_PUBLIC_BACKEND_URL=https://trackmyrmc.com' frontend/Dockerfile >/dev/null
          grep -F '<Redirect href="/login"' frontend/app/index.tsx >/dev/null
          grep -F 'trackmyrmc-legacy-web-cache-reset-v1' frontend/app/+html.tsx >/dev/null
          grep -F 'location = /service-worker.js' frontend/nginx.conf >/dev/null
          grep -F 'legacy-service-worker.js /usr/share/nginx/html/service-worker.js' frontend/Dockerfile >/dev/null

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify pinned Google Cloud target exists
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test -n "$ACTIVE_ACCOUNT"
          echo "Active account: $ACTIVE_ACCOUNT"
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='yaml(metadata.name,status.url,status.latestReadyRevisionName)'

      - name: Deploy current Expo web app
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SHA:0:12}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source frontend \
            --platform managed \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 5 \
            --quiet \
            --update-labels="source-sha=${SHORT_SHA},managed-by=github-actions,component=web,deployment-tier=production"

      - name: Resolve web service URL and revision
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          test -n "$URL"
          test -n "$REVISION"
          echo "WEB_URL=$URL" >> "$GITHUB_ENV"
          echo "WEB_REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "Web URL: $URL"
          echo "Ready revision: $REVISION"

      - name: Verify web revision is Ready
        shell: bash
        run: |
          set -euo pipefail
          READY="$(gcloud run revisions describe "$WEB_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.conditions[0].status)')"
          test "$READY" = "True"
          gcloud run revisions describe "$WEB_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='yaml(metadata.name,metadata.labels,status.conditions,status.imageDigest)'

      - name: Verify current production Cloud Run routes are the new Expo UI
        shell: bash
        run: |
          set -euo pipefail
          assert_fresh_expo() {
            local url="$1"
            local out="$2"
            local code
            code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -L -sS -o "$out" -w '%{http_code}' "$url")"
            echo "$url -> HTTP $code"
            test "$code" = "200" || { cat "$out"; exit 1; }
            test -s "$out" || { echo "Empty response for $url"; exit 1; }
            grep -F '_expo/static/' "$out" >/dev/null || {
              echo "Expected current Expo web shell was not found at $url"
              head -c 1200 "$out" || true
              exit 1
            }
            if grep -Eqi 'Built for every pour|Ready-Mix Concrete Tracking & RMC Plant Discovery' "$out"; then
              echo "Legacy Concrete King landing content detected at $url"
              exit 1
            fi
          }

          assert_no_store() {
            local url="$1"
            local headers
            headers="$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -D - -o /dev/null "$url" | tr -d '\r')"
            echo "$headers"
            echo "$headers" | grep -Eqi '^cache-control:.*no-store' || {
              echo "Expected no-store cache policy at $url"
              exit 1
            }
          }

          assert_retirement_worker() {
            local base="$1"
            local body="/tmp/legacy-worker.js"
            local headers="/tmp/legacy-worker.headers"
            local code
            code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -D "$headers" -o "$body" -w '%{http_code}' "${base}/service-worker.js")"
            echo "${base}/service-worker.js -> HTTP $code"
            test "$code" = "200" || { cat "$headers"; exit 1; }
            grep -F 'registration.unregister' "$body" >/dev/null || {
              echo "Expected legacy worker retirement shim at ${base}/service-worker.js"
              exit 1
            }
            tr -d '\r' < "$headers" | grep -Eqi '^cache-control:.*no-store' || {
              echo "Expected no-store cache policy for ${base}/service-worker.js"
              exit 1
            }
          }

          for path in / /login /privacy_policy /terms /account-deletion /passkey-ceremony /passkey-setup; do
            assert_fresh_expo "${WEB_URL}${path}" /tmp/web-response
          done

          assert_no_store "${WEB_URL}/login"
          assert_retirement_worker "$WEB_URL"

          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${WEB_URL}/api/health" >/tmp/web-api-health.json
          grep -F 'healthy' /tmp/web-api-health.json >/dev/null

      - name: Diagnose public host routing
        shell: bash
        run: |
          set +e
          echo "Cloud Run domain mappings (best effort):"
          gcloud run domain-mappings list --project "$PROJECT_ID" --region "$REGION" \
            --format='table(metadata.name,status.conditions[0].status,status.resourceRecords)' 2>&1 || true
          echo "External HTTPS URL maps (best effort):"
          gcloud compute url-maps list --project "$PROJECT_ID" \
            --format='table(name,defaultService)' 2>&1 || true
          set -e

      - name: Verify canonical and www production routes are fresh
        shell: bash
        run: |
          set -euo pipefail
          assert_fresh_expo() {
            local url="$1"
            local out="$2"
            local code effective
            code="$(curl --retry 5 --retry-all-errors --retry-delay 2 -L -sS -o "$out" -w '%{http_code}' "$url")"
            effective="$(curl --retry 3 --retry-all-errors --retry-delay 1 -L -sS -o /dev/null -w '%{url_effective}' "$url")"
            echo "$url -> HTTP $code -> $effective"
            test "$code" = "200" || { cat "$out"; exit 1; }
            grep -F '_expo/static/' "$out" >/dev/null || {
              echo "Expected current Expo web shell was not found at $url"
              head -c 1200 "$out" || true
              exit 1
            }
            if grep -Eqi 'Built for every pour|Ready-Mix Concrete Tracking & RMC Plant Discovery' "$out"; then
              echo "Legacy Concrete King landing content detected at $url"
              exit 1
            fi
          }

          assert_public_cache_policy() {
            local url="$1"
            local headers
            headers="$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS -D - -o /dev/null "$url" | tr -d '\r')"
            echo "$headers"
            echo "$headers" | grep -Eqi '^cache-control:.*no-store' || {
              echo "Expected canonical no-store policy at $url"
              exit 1
            }
          }

          for path in / /login /privacy_policy /terms /account-deletion /passkey-ceremony /passkey-setup; do
            assert_fresh_expo "https://${PRODUCTION_HOST}${path}" /tmp/domain-response
          done

          for path in / /login; do
            assert_fresh_expo "https://${WWW_HOST}${path}" /tmp/www-response
          done

          assert_public_cache_policy "https://${PRODUCTION_HOST}/login"

          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "https://${PRODUCTION_HOST}/service-worker.js" >/tmp/domain-worker.js
          grep -F 'registration.unregister' /tmp/domain-worker.js >/dev/null

          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "https://${PRODUCTION_HOST}/api/health" >/tmp/domain-health.json
          grep -F 'healthy' /tmp/domain-health.json >/dev/null
