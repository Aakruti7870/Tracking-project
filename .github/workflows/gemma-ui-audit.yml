name: Gemma Full Application UI Audit

on:
  push:
    branches:
      - feat/admin-web-premium-ui-v2
    paths:
      - ".github/workflows/gemma-ui-audit.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: "UI audit scope"
        required: true
        default: "all-application"

permissions:
  contents: read

jobs:
  gemma-ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build complete UI inventory
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path("frontend/app"),
              Path("frontend/src/screens"),
              Path("frontend/src/components"),
              Path("frontend/src/theme"),
              Path("frontend/src/ui"),
          ]
          exts = {".tsx", ".ts", ".jsx", ".js"}
          blocked = {
              ".env", "secret", "credentials", ".pem", ".p12", ".jks",
              "keystore", "google-services.json", "node_modules", "dist",
          }

          files = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in exts:
                      continue
                  low = str(path).lower()
                  if any(item in low for item in blocked):
                      continue
                  files.append(path)

          files = sorted(set(files))
          Path("gemma-ui-files.txt").write_text(
              "\n".join(str(path) for path in files), encoding="utf-8"
          )
          print(f"Complete UI inventory contains {len(files)} files")
          PY

      - name: Audit entire TrackMyRMC mobile UI with Gemma
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMMA_MODEL: ${{ vars.GEMMA_MODEL }}
          AUDIT_SCOPE: ${{ github.event.inputs.scope || 'all-application' }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import socket
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ.get("NVIDIA_API_KEY")
          model = os.environ.get("GEMMA_MODEL")
          scope = os.environ.get("AUDIT_SCOPE", "all-application")
          if not api_key:
              raise SystemExit("NVIDIA_API_KEY is missing")
          if not model:
              raise SystemExit("GEMMA_MODEL is missing")

          inventory = pathlib.Path("gemma-ui-files.txt")
          files = [pathlib.Path(line) for line in inventory.read_text(encoding="utf-8").splitlines() if line.strip()]
          if not files:
              raise SystemExit("No UI files found")

          system_prompt = """
          You are the senior mobile product-design and React Native/Expo engineering reviewer for TrackMyRMC.
          Review the supplied implementation evidence as a premium production application.

          NON-NEGOTIABLE RULES:
          - Super Admin / Central Admin / Authority privileged pages must stay OUT of the public mobile app. They belong only to the dedicated admin website.
          - Preserve authentication, six-digit OTP behavior, KYC/DigiLocker, payments, order lifecycle, GPS/tracking, role routing, Play policy, backend contracts and accessibility.
          - Do not invent backend endpoints or business behavior.
          - Prefer shared design tokens/components and incremental code changes over a risky rewrite.
          - Identify exact files/components when possible.
          - Separate visual-only changes from behavior-sensitive changes.
          """

          def call_gemma(prompt, max_tokens):
              payload = {
                  "model": model,
                  "messages": [
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": prompt},
                  ],
                  "temperature": 0.15,
                  "max_tokens": max_tokens,
                  "stream": False,
              }
              data = json.dumps(payload).encode("utf-8")
              for attempt in range(2):
                  request = urllib.request.Request(
                      "https://integrate.api.nvidia.com/v1/chat/completions",
                      data=data,
                      headers={
                          "Authorization": f"Bearer {api_key}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=360) as response:
                          result = json.loads(response.read().decode("utf-8"))
                      answer = result["choices"][0]["message"]["content"]
                      if not answer:
                          raise RuntimeError("empty response")
                      return answer
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      raise SystemExit(f"Gemma API failed: HTTP {exc.code}\n{body[:1200]}")
                  except (TimeoutError, socket.timeout, RuntimeError, KeyError, IndexError) as exc:
                      if attempt == 1:
                          raise SystemExit(f"Gemma request failed after retry: {exc}")
                      print(f"Gemma request retry after transient failure: {exc}")
                      time.sleep(10)
              raise SystemExit("Gemma request failed")

          def compact_source(path):
              text = path.read_text(encoding="utf-8", errors="replace")
              lines = text.splitlines()
              imports = [line.strip() for line in lines if line.lstrip().startswith(("import ", "export "))][:20]
              symbols = re.findall(r"(?:function|const|class)\s+([A-Za-z0-9_]+)", text)[:24]
              visible_strings = re.findall(r"[\"']([^\"'\n]{3,70})[\"']", text)
              visible_strings = [s for s in visible_strings if not s.startswith(("http", "../", "./", "/api"))][:30]
              # Every file is represented. Include a bounded source excerpt so Gemma can
              # review actual component/layout/style code without oversized requests.
              excerpt = text[:6000]
              return (
                  f"\n### FILE {path}\n"
                  f"SYMBOLS: {', '.join(symbols)}\n"
                  f"IMPORT/EXPORT: {' | '.join(imports)}\n"
                  f"UI STRINGS: {' | '.join(visible_strings)}\n"
                  f"SOURCE EXCERPT:\n```tsx\n{excerpt}\n```\n"
              )

          batch_size = 10
          batch_reports = []
          total_batches = (len(files) + batch_size - 1) // batch_size

          for index in range(0, len(files), batch_size):
              batch = files[index:index + batch_size]
              evidence = "".join(compact_source(path) for path in batch)
              batch_no = index // batch_size + 1
              prompt = f"""
              AUDIT SCOPE: {scope}
              FULL APPLICATION BATCH: {batch_no}/{total_batches}
              Files in this batch are part of a complete repository-wide mobile UI inventory.

              For every supplied file, identify only material findings, then return:
              ## P0/P1 defects
              ## Premium UI opportunities
              ## Design-system inconsistencies
              ## Accessibility/responsive issues
              ## Graphics/icon/motion opportunities
              ## Shared components/tokens to introduce
              ## Behavior-sensitive files requiring extra care
              ## Screenshot/device verification targets

              Keep this batch report concise (roughly 900-1300 words) while covering all files.

              IMPLEMENTATION EVIDENCE:
              {evidence}
              """
              report = call_gemma(prompt, 1800)
              batch_reports.append(report)
              pathlib.Path(f"gemma-ui-batch-{batch_no:02d}.md").write_text(report, encoding="utf-8")
              print(f"Completed Gemma mobile UI audit batch {batch_no}/{total_batches}")
              time.sleep(2)

          # Hierarchical consolidation prevents the final request from becoming oversized.
          group_summaries = []
          group_size = 4
          for index in range(0, len(batch_reports), group_size):
              group = batch_reports[index:index + group_size]
              group_no = index // group_size + 1
              prompt = f"""
              Consolidate these mobile UI audit batch reports into a compact implementation summary.
              Preserve exact file names, P0/P1 findings, shared component/token proposals,
              behavior-sensitive warnings and device-verification requirements. Remove duplication.

              REPORTS:
              {'\n\n---\n\n'.join(group)}
              """
              summary = call_gemma(prompt, 1800)
              group_summaries.append(summary)
              pathlib.Path(f"gemma-ui-group-{group_no:02d}.md").write_text(summary, encoding="utf-8")
              print(f"Completed Gemma audit consolidation group {group_no}")
              time.sleep(2)

          final_prompt = f"""
          Build the FINAL TrackMyRMC full-application mobile UI implementation roadmap from these consolidated audits.
          The roadmap will be handed to Laguna for coding and Kimi for architecture/regression review.

          Required sections:
          ## Executive UI Verdict
          ## Non-Negotiable Mobile/Admin Boundary
          ## Global Design System To Lock
          ## Typography Scale
          ## Light And Dark Color System
          ## Buttons Inputs And Form States
          ## Cards Surfaces And Data Density
          ## Navigation Headers Tabs And FAB
          ## Icons Graphics Maps And Motion
          ## Login OTP And Authentication UX
          ## Customer And Ordering UX
          ## Plant Staff And Operations UX
          ## Driver Tracking Attendance And SOS UX
          ## KYC Payments Profile And Settings UX
          ## Shared Components And Tokens To Build First
          ## File Groups In Implementation Order
          ## Behavior-Sensitive Changes That Need Extra Tests
          ## Accessibility Responsive And Reduced-Motion Rules
          ## Screenshot And Real-Device Verification Matrix
          ## P0 P1 P2 P3 Coding Roadmap

          Requirements:
          - cover the entire mobile application inventory, not only Login/Home
          - keep Central Admin/Authority privileged pages web-only
          - do not propose a wholesale language rewrite
          - make recommendations implementable in React Native/TypeScript and Kotlin where native Android capability is genuinely needed

          CONSOLIDATED AUDITS:
          {'\n\n=====\n\n'.join(group_summaries)}
          """
          final_report = call_gemma(final_prompt, 4200)
          pathlib.Path("gemma-full-ui-audit.md").write_text(final_report, encoding="utf-8")

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as handle:
                  handle.write("# Gemma Full Application UI Audit\n\n")
                  handle.write(f"Audited **{len(files)} UI source files** across the mobile application.\n\n")
                  handle.write(final_report)
                  handle.write("\n")

          print(f"Gemma full-application UI audit completed for {len(files)} files.")
          PY

      - name: Upload complete Gemma UI audit
        uses: actions/upload-artifact@v4
        with:
          name: gemma-full-ui-audit
          path: |
            gemma-full-ui-audit.md
            gemma-ui-files.txt
            gemma-ui-batch-*.md
            gemma-ui-group-*.md
          retention-days: 7
