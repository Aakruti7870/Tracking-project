name: Apply responsive theme hero fix

on:
  push:
    branches:
      - fix/theme-responsive-hero-assets

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/theme-responsive-hero-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply hero patch
        run: node scripts/apply-responsive-hero-fix.mjs
      - name: Verify no crop and theme switching guards
        run: |
          grep -q 'contentFit="contain"' frontend/app/login.tsx
          grep -q 'contentFit="contain"' frontend/app/customer/index.tsx
          grep -q 'HERO_LIGHT' frontend/app/login.tsx
          grep -q 'HERO_DARK' frontend/app/login.tsx
          grep -q 'HERO_LIGHT' frontend/app/customer/index.tsx
          grep -q 'HERO_DARK' frontend/app/customer/index.tsx
          ! grep -q 'source={HERO}.*contentFit="cover"' frontend/app/login.tsx
          ! grep -q 'source={HERO}.*contentFit="cover"' frontend/app/customer/index.tsx
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app/login.tsx frontend/app/customer/index.tsx
          git commit -m 'Fix theme-aware no-crop login and home heroes'
          git push origin HEAD:fix/theme-responsive-hero-assets
