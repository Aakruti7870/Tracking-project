name: Repository Hygiene Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dead code, duplicates and build scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      EXPO_PUBLIC_BACKEND_URL: https://api.example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic repository scanner
        run: python scripts/repo_hygiene_audit.py

      - name: Compile all backend Python
        continue-on-error: true
        run: python -m compileall -q backend

      - name: Python dead-code advisory scan
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q vulture==2.14
          vulture backend --min-confidence 80 > repo-hygiene-vulture.txt || true
          cat repo-hygiene-vulture.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        continue-on-error: true
        run: npm run typecheck

      - name: Expo lint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Auth routing regression
        working-directory: frontend
        continue-on-error: true
        run: npm run check:auth-routing

      - name: Google Play policy guard
        working-directory: frontend
        continue-on-error: true
        run: npm run check:play-policy

      - name: Frontend dead-code/dependency advisory scan
        working-directory: frontend
        continue-on-error: true
        shell: bash
        run: |
          npx --yes knip@5 --reporter compact > ../repo-hygiene-knip.txt 2>&1 || true
          cat ../repo-hygiene-knip.txt

      - name: Preview web export
        working-directory: frontend
        continue-on-error: true
        run: npm run build:preview

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          echo '## Repository Hygiene Audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat repo-hygiene-report.md >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Vulture advisory' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat repo-hygiene-vulture.txt 2>/dev/null | head -n 200 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### Knip advisory' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat repo-hygiene-knip.txt 2>/dev/null | head -n 300 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-hygiene-audit
          path: |
            repo-hygiene-report.md
            repo-hygiene-report.json
            repo-hygiene-vulture.txt
            repo-hygiene-knip.txt
          if-no-files-found: warn
          retention-days: 7
