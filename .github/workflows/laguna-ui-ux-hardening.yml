name: Laguna UI UX TypeScript Hardening

on:
  push:
    branches:
      - feat/ui-ux-final-polish
    paths:
      - "docs/ui/trackmyrmc-final-ui-reference.md"
      - "frontend/src/theme/**"
      - "frontend/src/components/ui/**"
      - "frontend/src/components/OrderCard.tsx"
      - "frontend/src/components/PlantCard.tsx"
      - "frontend/src/components/KycBanner.tsx"
      - "frontend/src/screens/**"
      - "frontend/app/**"
      - ".github/workflows/laguna-ui-ux-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laguna-ui-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Review UI TypeScript correctness with Laguna XS
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LAGUNA_MODEL: ${{ vars.LAGUNA_MODEL }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, re, socket, time, urllib.error, urllib.request

          key=os.environ.get("NVIDIA_API_KEY")
          model=os.environ.get("LAGUNA_MODEL")
          if not key: raise SystemExit("NVIDIA_API_KEY is missing")
          if not model: raise SystemExit("LAGUNA_MODEL is missing")

          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          contract=(root/"docs/ui/trackmyrmc-final-ui-reference.md").read_text(encoding="utf-8",errors="replace")
          selected=[
            "frontend/src/theme/tokens.ts",
            "frontend/src/components/ui/Button.tsx",
            "frontend/src/components/ui/Input.tsx",
            "frontend/src/components/ui/Card.tsx",
            "frontend/src/components/ui/AppText.tsx",
            "frontend/src/components/OrderCard.tsx",
            "frontend/src/components/PlantCard.tsx",
            "frontend/src/components/KycBanner.tsx",
            "frontend/src/screens/LoginScreen.tsx",
            "frontend/app/role-home.tsx",
            "frontend/app/kyc.tsx",
            "frontend/app/kyc/return.tsx",
          ]
          blocks=[]
          for rel in selected:
            p=(root/rel).resolve()
            if not p.is_file(): continue
            raw=p.read_text(encoding="utf-8",errors="replace")
            raw=re.sub(r'(?i)((?:api[_-]?key|secret|password|token)\s*[:=]\s*["\'])[^"\']+(["\'])',r'\1[REDACTED]\2',raw)
            blocks.append(f"\n===== {rel} =====\n{raw[:16000]}\n")

          system="""You are Laguna XS reviewing TrackMyRMC production React Native TypeScript for correctness, security, accessibility and performance during a UI-system modernization. Review repository evidence only. Do not redesign backend contracts. Preserve auth/session, KYC/DigiLocker, payments, GPS/tracking, production order lifecycle, Android identity/signing/App Links, MongoDB/API behavior, Play policy and privileged-role boundaries. Distinguish proven findings from hypotheses. Prefer smallest safe patches. Verification green is reserved for KYC/identity VERIFIED UI. Do not claim visual image access; the supplied UI contract is authoritative."""

          user=(
            "Audit the implementation against the UI contract with special focus on whether presentation changes could introduce correctness/security/performance regressions.\n\n"
            "UI CONTRACT:\n"
            f"{contract}\n\n"
            "FILES:\n"
            f"{''.join(blocks)}\n\n"
            "Return exactly:\n"
            "## Verdict\n"
            "## P0 Security Findings\n"
            "## P1 Correctness Findings\n"
            "## P1 Performance Findings\n"
            "## Accessibility / Interaction Findings\n"
            "## State / Theme Consistency Findings\n"
            "## KYC Identity Presentation Findings\n"
            "## Confirmed Good Changes\n"
            "## Minimal Patches Required\n"
            "## Tests Required Before Merge\n"
            "## Final Go / No-Go\n\n"
            "Every actionable finding must name exact files and proven behavior."
          )

          payload={"model":model,"messages":[{"role":"system","content":system},{"role":"user","content":user}],"temperature":0.1,"max_tokens":4800,"stream":False}
          req=urllib.request.Request("https://integrate.api.nvidia.com/v1/chat/completions",data=json.dumps(payload).encode(),headers={"Authorization":f"Bearer {key}","Content-Type":"application/json","Accept":"application/json"},method="POST")
          answer=None; last=None
          for attempt in range(1,4):
            try:
              with urllib.request.urlopen(req,timeout=300) as r: result=json.loads(r.read().decode())
              answer=result["choices"][0]["message"]["content"]
              if answer: break
            except Exception as e:
              last=f"{type(e).__name__}: {e}"
              if attempt<3: time.sleep(attempt*10)
          out=pathlib.Path("laguna-final-ui-hardening.md")
          if not answer:
            out.write_text(f"# Laguna UI UX Hardening\n\nNo usable response.\n\n{last}\n",encoding="utf-8")
            raise SystemExit(last)
          out.write_text(answer,encoding="utf-8")
          if os.environ.get("GITHUB_STEP_SUMMARY"):
            pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("# Laguna UI UX Hardening\n\n"+answer,encoding="utf-8")
          PY

      - name: Upload Laguna UI hardening report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laguna-final-ui-hardening
          path: laguna-final-ui-hardening.md
          if-no-files-found: ignore
          retention-days: 14
