name: Tracking Project Full Gate

on:
  push:
    branches:
      - main
      - fix/tracking-project-100-percent
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracking-project-full-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend compile + schema + full tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: tracking_project_ci
      JWT_SECRET: ci-only-tracking-project-jwt-secret-32chars-minimum
      OTP_PEPPER: ci-only-tracking-project-otp-pepper-32chars-minimum
      DEBUG_OTP: "true"
      OTP_RESEND_SECONDS: "1"
      CORS_ORIGINS: http://127.0.0.1:8081
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      STORAGE_MODE: local
      LOCAL_STORAGE_DIR: /tmp/tracking-project-storage
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements-ci.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Import full schema and routers
        working-directory: backend
        run: |
          python - <<'PY'
          import business_models
          import database
          import push_notifications
          import server
          from routers import account_deletion, business_ui, finance_ops, loads, master_data, operator_ops
          assert server.app is not None
          assert business_models.PlantBusinessProfileBody
          assert push_notifications.push.name == "firebase_fcm_v1"
          assert account_deletion.router and business_ui.router and finance_ops.router
          assert loads.router and master_data.router and operator_ops.router
          print("full schema/router import OK")
          PY
      - name: Start API
        working-directory: backend
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8000 >/tmp/tracking-project-api.log 2>&1 &
          echo $! >/tmp/tracking-project-api.pid
      - name: Verify root and API health
        run: |
          set -e
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/root-health.json && curl -fsS http://127.0.0.1:8000/api/health >/tmp/api-health.json; then
              cat /tmp/root-health.json
              cat /tmp/api-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tracking-project-api.log || true
          exit 1
      - name: Full backend test suite
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -n 0 -q --tb=short 2>&1 | tee /tmp/tracking-project-pytest.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-project-backend-diagnostics
          path: |
            /tmp/tracking-project-api.log
            /tmp/tracking-project-pytest.log
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend typecheck + lint + Expo + web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.PREVIEW_BACKEND_URL || 'https://api.example.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate mobile identities and Firebase client
        working-directory: frontend
        run: |
          node - <<'NODE'
          const cfg = require('./app.json').expo;
          const firebase = require('./google-services.json');
          if (cfg.android.package !== 'com.trackmyrmc.concreteking') throw new Error('Android package mismatch');
          if (cfg.ios.bundleIdentifier !== 'com.trackmyrmc.concreteking') throw new Error('iOS bundle identifier mismatch');
          if (cfg.android.versionCode !== 65) throw new Error('versionCode mismatch');
          if (cfg.version !== '2.0.7') throw new Error('version mismatch');
          if (cfg.android.googleServicesFile !== './google-services.json') throw new Error('Firebase config path mismatch');
          const pkg = firebase.client?.[0]?.client_info?.android_client_info?.package_name;
          if (pkg !== cfg.android.package) throw new Error('Firebase Android package mismatch');
          if (firebase.project_info?.project_id !== 'track-my-rmc') throw new Error('Firebase project mismatch');
          console.log('mobile identity + Firebase client OK');
          NODE
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Reject unfinished product placeholders
        shell: bash
        run: |
          set -euo pipefail
          pattern='arrives in a later phase|arrives in the next phases|arrives in a later/next phase|coming soon|Coming soon|COMING SOON'
          if git grep -n -I -E "$pattern" -- frontend/app frontend/src; then
            echo "Unfinished product placeholder copy remains in the application."
            exit 1
          fi
          if git grep -n -I -F 'TrackMyRMC · v1.0.0' -- frontend/app frontend/src; then
            echo "Stale application version copy remains in the UI."
            exit 1
          fi
      - name: Expo Doctor
        working-directory: frontend
        run: npm run doctor
      - name: Public Expo config
        working-directory: frontend
        run: npx expo config --type public >/tmp/expo-config.txt && test -s /tmp/expo-config.txt
      - name: Web preview build
        working-directory: frontend
        run: npm run build:preview

  android-native:
    name: Android native generation + debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.PREVIEW_BACKEND_URL || 'https://api.example.invalid' }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated Android identity and Firebase wiring
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          gradle_file=$(find android/app -maxdepth 1 -type f -name 'build.gradle*' | head -n 1)
          test -n "$gradle_file"
          test -f android/app/google-services.json
          grep -F "com.trackmyrmc.concreteking" "$gradle_file" >/dev/null
          grep -E "versionCode[[:space:]=]+65" "$gradle_file" >/dev/null
          grep -F "com.google.gms.google-services" "$gradle_file" >/dev/null
      - name: Compile debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload connected preview APK
        if: env.EXPO_PUBLIC_BACKEND_URL != 'https://api.example.invalid'
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-2.0.7-vc65-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  repository-security:
    name: Secret and signing guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked secret/signing files
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env($|\.)|credentials\.json$|firebase-adminsdk[^/]*\.json$|[^/]*service[-_]?account[^/]*\.json$|\.credentials($|/)|.*\.(key|pem|p12|pfx|jks|keystore)$)' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Tracked secret/signing files are forbidden:"
            echo "$bad"
            exit 1
          fi
      - name: Reject private key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY-----' -- ':!*.md' ':!*.example'; then
            echo "Private key material detected"
            exit 1
          fi
