name: Cloud Run Container Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Build and boot Cloud Run backend container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build backend container
        run: docker build --pull -t tracking-project-api:ci .
      - name: Boot backend container
        run: |
          docker run -d --name tracking-project-api-ci --network host \
            -e APP_ENV=test \
            -e MONGO_URL=mongodb://127.0.0.1:27017 \
            -e DB_NAME=tracking_cloudrun_ci \
            -e DEBUG_OTP=true \
            -e STORAGE_MODE=local \
            tracking-project-api:ci
      - name: Verify API health
        run: |
          set -e
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs tracking-project-api-ci || true
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs tracking-project-api-ci || true
