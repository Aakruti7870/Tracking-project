name: Pre-AAB End-to-End Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-aab-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-business-lifecycle:
    name: Order to delivery and payment E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: trackmyrmc_pre_aab_e2e_ci
      JWT_SECRET: ci-only-trackmyrmc-jwt-secret-not-for-production-32chars
      OTP_PEPPER: ci-only-trackmyrmc-otp-pepper-not-for-production-32chars
      DEBUG_OTP: "true"
      OTP_RESEND_SECONDS: "1"
      CORS_ORIGINS: http://127.0.0.1:8081
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      STORAGE_MODE: local
      LOCAL_STORAGE_DIR: /tmp/trackmyrmc-pre-aab-e2e-storage
      PYTHONPATH: .

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install backend CI dependencies
        working-directory: backend
        run: python -m pip install -r requirements-ci.txt

      - name: Compile backend and E2E test
        working-directory: backend
        run: python -m py_compile server.py tests/test_pre_aab_e2e.py

      - name: Start isolated backend
        working-directory: backend
        run: |
          rm -f /tmp/trackmyrmc-pre-aab-e2e.log
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/trackmyrmc-pre-aab-e2e.log 2>&1 &
          echo $! > /tmp/trackmyrmc-pre-aab-e2e.pid

      - name: Wait for seeded API health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /tmp/pre-aab-health.json; then
              cat /tmp/pre-aab-health.json
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy"
          cat /tmp/trackmyrmc-pre-aab-e2e.log || true
          exit 1

      - name: Run complete end-to-end lifecycle
        working-directory: backend
        run: pytest -n 0 -q tests/test_pre_aab_e2e.py --tb=short

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/trackmyrmc-pre-aab-e2e.log || true

      - name: Stop isolated backend
        if: always()
        run: |
          if [ -f /tmp/trackmyrmc-pre-aab-e2e.pid ]; then
            kill "$(cat /tmp/trackmyrmc-pre-aab-e2e.pid)" 2>/dev/null || true
          fi
