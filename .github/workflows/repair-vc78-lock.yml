name: Repair vc78 dependency lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.head_ref == 'chore/bump-v2.0.20-vc78'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - name: Regenerate lockfile from supported dependency set
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'fix(android): restore supported vc78 dependency lock'
          git push origin HEAD:${{ github.head_ref }}
