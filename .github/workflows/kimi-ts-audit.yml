name: Kimi K3 Full TypeScript Migration Audit

on:
  push:
    branches:
      - feat/kimi-k3-agent
    paths:
      - ".github/workflows/kimi-ts-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit all TypeScript and TSX with Kimi K3
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.request

          API_URL = "https://integrate.api.nvidia.com/v1/chat/completions"
          api_key = os.environ.get("NVIDIA_API_KEY")
          model = os.environ.get("KIMI_MODEL")
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()

          if not api_key:
              raise SystemExit("NVIDIA_API_KEY is missing")
          if not model:
              raise SystemExit("KIMI_MODEL is missing")

          excluded_parts = {
              ".git", "node_modules", "dist", "build", ".expo", ".next",
              "coverage", "Pods", ".gradle", ".idea", "vendor"
          }

          blocked_names = {
              ".env", ".env.local", ".env.production", "google-services.json"
          }

          def allowed(path: pathlib.Path) -> bool:
              rel = path.relative_to(workspace)
              if any(part in excluded_parts for part in rel.parts):
                  return False
              if path.name in blocked_names:
                  return False
              lower = str(rel).lower()
              if any(x in lower for x in ["secret", "credential", "keystore", ".pem", ".p12", ".jks"]):
                  return False
              return path.suffix.lower() in {".ts", ".tsx"}

          files = sorted(p for p in workspace.rglob("*") if p.is_file() and allowed(p))
          if not files:
              raise SystemExit("No TypeScript/TSX files found")

          def scrub(text: str) -> str:
              patterns = [
                  r'(?i)((?:api[_-]?key|secret|password|passwd|token|auth[_-]?token)\s*[:=]\s*["\'])[^"\']+(["\'])',
                  r'(?i)(authorization\s*[:=]\s*["\']bearer\s+)[^"\']+(["\'])',
                  r'(?i)(bearer\s+)[A-Za-z0-9._~+\-/=]{16,}',
              ]
              for pattern in patterns:
                  text = re.sub(pattern, r'\1[REDACTED]\2' if pattern != patterns[-1] else r'\1[REDACTED]', text)
              return text

          inventory = []
          prepared = []
          for path in files:
              rel = str(path.relative_to(workspace))
              raw = path.read_text(encoding="utf-8", errors="replace")
              size = len(raw.encode("utf-8"))
              inventory.append({"path": rel, "bytes": size})
              # Keep every file represented. Very large files are truncated but explicitly marked.
              max_chars = 70000
              truncated = len(raw) > max_chars
              body = raw[:max_chars]
              body = scrub(body)
              prepared.append((rel, size, truncated, body))

          pathlib.Path("typescript-inventory.json").write_text(
              json.dumps(inventory, indent=2), encoding="utf-8"
          )

          system_prompt = """
          You are the senior migration architect for TrackMyRMC.

          The current mobile frontend uses Expo + React Native + TypeScript. The backend is Python.
          The objective is NOT to rewrite everything blindly. The objective is to determine exactly
          which TypeScript/TSX files should remain TypeScript and which Android-critical behavior
          should migrate to native Kotlin.

          For every supplied file, classify it as exactly one of:
          - KEEP_TYPESCRIPT
          - CONVERT_TO_KOTLIN
          - REDESIGN_BEFORE_CONVERSION
          - SECURITY_REVIEW
          - POSSIBLY_REMOVE

          Rules:
          - Preserve API contracts, authentication behavior, business logic and Play Store compliance.
          - Do not recommend Kotlin for web/admin-only UI merely for consistency.
          - Prefer Kotlin for Android-native concerns such as permissions, secure storage, notifications,
            deep links, background tasks, location/GPS, native payment bridges and Android lifecycle work.
          - Separate confirmed findings from assumptions.
          - Flag duplicate logic, dead code, unsafe patterns, brittle routing and likely runtime bugs.
          - Never claim a test passed unless test output is supplied.
          - Do not modify code.
          """

          def call_kimi(messages, max_tokens=4500, retries=3):
              payload = {
                  "model": model,
                  "messages": messages,
                  "temperature": 0.15,
                  "reasoning_effort": "high",
                  "max_tokens": max_tokens,
                  "stream": False,
              }
              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              for attempt in range(1, retries + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=240) as response:
                          result = json.loads(response.read().decode("utf-8"))
                      answer = result["choices"][0]["message"]["content"]
                      if not answer:
                          raise RuntimeError("Empty Kimi response")
                      return answer
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, RuntimeError) as exc:
                      if attempt == retries:
                          raise
                      print(f"Kimi request attempt {attempt} failed: {exc}; retrying...")
                      time.sleep(attempt * 5)

          # Batch by approximate character size so every TS/TSX file is included in the audit.
          batches = []
          current = []
          current_chars = 0
          batch_limit = 180000
          for item in prepared:
              rel, size, truncated, body = item
              block = (
                  f"\n\n===== FILE: {rel} | bytes={size} | truncated={truncated} =====\n"
                  f"{body}\n===== END FILE: {rel} =====\n"
              )
              if current and current_chars + len(block) > batch_limit:
                  batches.append("".join(current))
                  current = []
                  current_chars = 0
              current.append(block)
              current_chars += len(block)
          if current:
              batches.append("".join(current))

          print(f"Found {len(files)} TS/TSX files across {len(batches)} Kimi audit batches.")

          batch_reports = []
          for index, batch in enumerate(batches, start=1):
              user_prompt = f"""
          This is TypeScript migration audit batch {index} of {len(batches)}.

          Analyze EVERY file in this batch.

          For each file return one compact row with:
          PATH | CLASSIFICATION | ANDROID RELEVANCE | RISK | KEY DEPENDENCIES | REASON

          Then add:
          ## Confirmed Bugs / Defects
          ## Security / Reliability Concerns
          ## Cross-file Dependencies Seen In This Batch
          ## Suggested Migration Order For This Batch

          Files:
          {batch}
          """
              report = call_kimi([
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt},
              ])
              batch_reports.append(report)
              pathlib.Path(f"kimi-ts-audit-batch-{index:02d}.md").write_text(report, encoding="utf-8")

          combined_reports = "\n\n".join(
              f"===== BATCH {i} =====\n{report}"
              for i, report in enumerate(batch_reports, start=1)
          )

          synthesis_prompt = f"""
          You are producing the FINAL repository-wide TypeScript migration roadmap for TrackMyRMC.

          Repository inventory contains {len(files)} TypeScript/TSX files.
          Below are the completed batch audits. Synthesize them without dropping files.

          REQUIRED OUTPUT:
          # Executive Summary
          # Repository-Wide Classification Table
          Include every audited path with one of the five exact classifications.
          # Android Kotlin Conversion Candidates
          Prioritize P0 / P1 / P2.
          # Files That Must Stay TypeScript
          # Redesign Before Conversion
          # Confirmed Bugs / Defects
          # Security / Reliability Risks
          # Dependency / Coupling Risks
          # Recommended Migration Sequence
          Give numbered phases and explain prerequisites.
          # Tests Required Before Any Conversion
          # Stop Conditions / Rollback Strategy
          # Final Recommendation

          Important: do not recommend a mass rewrite merely to change language. Optimize for reliability,
          debuggability, Android performance, maintainability, and minimal regression risk.

          BATCH AUDITS:
          {combined_reports}
          """

          final_report = call_kimi([
              {"role": "system", "content": system_prompt},
              {"role": "user", "content": synthesis_prompt},
          ], max_tokens=7000)

          pathlib.Path("kimi-typescript-migration-audit.md").write_text(final_report, encoding="utf-8")

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as fh:
                  fh.write("# Kimi K3 TypeScript Migration Audit\n\n")
                  fh.write(f"Audited **{len(files)}** `.ts` / `.tsx` files in **{len(batches)}** batches.\n\n")
                  # GitHub step summaries have practical size limits, so include a useful prefix.
                  fh.write(final_report[:50000])
                  if len(final_report) > 50000:
                      fh.write("\n\n_Report truncated in Step Summary; download the artifact for the complete report._\n")

          print("Full TypeScript/TSX migration audit completed successfully.")
          PY

      - name: Upload migration audit
        uses: actions/upload-artifact@v4
        with:
          name: kimi-typescript-migration-audit
          path: |
            kimi-typescript-migration-audit.md
            kimi-ts-audit-batch-*.md
            typescript-inventory.json
          retention-days: 14
