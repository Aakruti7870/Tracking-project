name: Hero Merge Repair

on:
  push:
    branches:
      - fix/hero-assets-final

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: activate hero merge repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hero branch
        uses: actions/checkout@v4
        with:
          ref: fix/hero-assets-final
          fetch-depth: 0

      - name: Make valid hero JPEGs visible to the PR merge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('frontend/assets/images/login-hero-light.jpg'),
              Path('frontend/assets/images/login-hero-dark.jpg'),
              Path('frontend/assets/images/home-hero-light.jpg'),
              Path('frontend/assets/images/home-hero-dark.jpg'),
          ]

          sof_markers = {
              0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7,
              0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF,
          }

          def jpeg_size(data: bytes):
              if len(data) < 4 or data[:2] != b'\xff\xd8' or data[-2:] != b'\xff\xd9':
                  raise ValueError('invalid JPEG SOI/EOI')
              i = 2
              while i + 3 < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  if i >= len(data):
                      break
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9) or 0xD0 <= marker <= 0xD7:
                      continue
                  if i + 2 > len(data):
                      break
                  seg_len = int.from_bytes(data[i:i+2], 'big')
                  if seg_len < 2 or i + seg_len > len(data):
                      raise ValueError('invalid JPEG segment length')
                  if marker in sof_markers:
                      if seg_len < 7:
                          raise ValueError('invalid SOF segment')
                      height = int.from_bytes(data[i+3:i+5], 'big')
                      width = int.from_bytes(data[i+5:i+7], 'big')
                      return width, height
                  i += seg_len
              raise ValueError('JPEG dimensions not found')

          for path in files:
              data = path.read_bytes()
              before = jpeg_size(data)
              marker_text = ('TMRMC_PR95_VALID_HERO:' + path.name).encode('ascii')
              segment = b'\xff\xfe' + (len(marker_text) + 2).to_bytes(2, 'big') + marker_text
              # A legal JPEG COM segment changes only metadata; compressed pixels are untouched.
              repaired = data[:2] + segment + data[2:]
              after = jpeg_size(repaired)
              if before != after:
                  raise SystemExit(f'{path}: dimensions changed {before} -> {after}')
              path.write_bytes(repaired)
              print(f'{path}: {after[0]}x{after[1]}, {len(data)} -> {len(repaired)} bytes')
          PY

      - name: Remove temporary repair controls
        shell: bash
        run: |
          rm -f .hero-transfer/status.txt
          rm -f .github/workflows/hero-merge-repair.yml

      - name: Commit repaired hero binaries to output branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/assets/images/login-hero-light.jpg \
                  frontend/assets/images/login-hero-dark.jpg \
                  frontend/assets/images/home-hero-light.jpg \
                  frontend/assets/images/home-hero-dark.jpg
          git add -A .hero-transfer .github/workflows/hero-merge-repair.yml
          git commit -m 'fix: force valid hero binaries into PR diff'
          git push --force origin HEAD:refs/heads/hero-repair-output
