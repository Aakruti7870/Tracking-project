name: UI Screenshot Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ui-screenshot-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_PUBLIC_ENABLE_DEMO_LOGIN: '1'
      EXPO_PUBLIC_BACKEND_URL: 'https://trackmyrmc-kyc-ui.preview.emergentagent.com'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Export real Expo web app
        working-directory: frontend
        run: npm run build:preview

      - name: Install screenshot browser
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exported app
        working-directory: frontend
        run: |
          npx --yes serve@14.2.4 -s dist -l 4173 > /tmp/trackmyrmc-ui-preview.log 2>&1 &
          echo $! > /tmp/trackmyrmc-ui-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/trackmyrmc-ui-preview.log
          exit 1

      - name: Capture real light and dark login proof
        working-directory: frontend
        run: |
          mkdir -p ../ui-proof
          cat > ./capture-ui-proof.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const baseURL = 'http://127.0.0.1:4173';
          const viewport = { width: 390, height: 844 };

          for (const scheme of ['light', 'dark']) {
            const context = await browser.newContext({
              viewport,
              colorScheme: scheme,
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();
            await page.goto(`${baseURL}/login`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(1200);
            await page.screenshot({
              path: `../ui-proof/login-${scheme}.png`,
              fullPage: true,
            });
            await context.close();
          }

          await browser.close();
          EOF
          node ./capture-ui-proof.mjs
          rm ./capture-ui-proof.mjs

      - name: Upload screenshot proof
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-ui-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: ui-proof/*.png
          if-no-files-found: error
          retention-days: 14
