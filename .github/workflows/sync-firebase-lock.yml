name: Sync Firebase npm lock

on:
  push:
    branches:
      - fix/tracking-project-100-percent
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tracking-project-100-percent
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - name: Regenerate npm lock only
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: sync Firebase notification lockfile"
          git push origin HEAD:fix/tracking-project-100-percent
