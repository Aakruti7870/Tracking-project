name: Release Signed AAB

# Produces a Google Play upload-signed .aab for com.trackmyrmc.concreteking.
# Required GitHub Actions secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64      - base64 of the Play upload keystore .jks / .p12
#   ANDROID_KEYSTORE_PASSWORD    - key password
#   ANDROID_STORE_PASSWORD       - keystore password
#   ANDROID_KEY_ALIAS            - alias inside the Play upload keystore
#
# IMPORTANT: Google Play currently expects the upload certificate SHA1 below.
# The workflow validates BOTH the restored keystore and the final AAB against it.
# A wrong/debug key therefore fails CI before any release artifact is uploaded.
#
# NOTE: Expo/AGP-generated release signing can crash in FinalizeBundleTask on some
# runner/AGP combinations. To avoid that AGP signing-path failure, this workflow
# deliberately builds an unsigned AAB, then signs the completed bundle with the
# validated Play upload key via jarsigner. AABs use standard JAR signing.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag or SHA to release-sign
        required: false
        default: main
  push:
    branches:
      - "release/signed-aab-v*"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-signed-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      EXPECTED_PLAY_UPLOAD_SHA1: "3D:5F:80:59:1C:BA:69:1B:03:28:4D:A1:74:91:38:1D:8F:A1:32:DC"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify canonical production backend
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/api/health" >/tmp/production-health.json
          grep -F 'healthy' /tmp/production-health.json >/dev/null
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/.well-known/assetlinks.json" >/tmp/assetlinks.json
          grep -F 'com.trackmyrmc.concreteking' /tmp/assetlinks.json >/dev/null

      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ] || missing+=("ANDROID_STORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || missing+=("ANDROID_KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks
          echo "keystore size: $(stat -c%s upload-keystore.jks) bytes"

      - name: Verify Play upload keystore fingerprint
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          certificate_info="$({ keytool -list -v \
            -keystore upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD"; } 2>/dev/null)"
          actual_sha1="$(printf '%s\n' "$certificate_info" | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '\r')"
          actual_sha256="$(printf '%s\n' "$certificate_info" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d '\r')"
          test -n "$actual_sha1" && test -n "$actual_sha256" || {
            echo "Unable to read public certificate fingerprints from configured upload keystore/alias"
            exit 1
          }
          echo "CONFIGURED_KEYSTORE_SHA1=$actual_sha1"
          echo "CONFIGURED_KEYSTORE_SHA256=$actual_sha256"
          if [ "$actual_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "SIGNING_CERT_MATCH=FAIL"
            echo "AAB_BUILD=BLOCKED"
            echo "ERROR: Configured upload certificate does not match Google Play."
            exit 1
          fi
          echo "SIGNING_CERT_MATCH=PASS"

      - name: Verify private key password
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PRIMARY_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          rm -rf /tmp/keycheck
          mkdir -p /tmp/keycheck
          printf 'TrackMyRMC signing probe\n' >/tmp/keycheck/probe.txt
          (cd /tmp/keycheck && jar --create --file probe.jar probe.txt)

          if jarsigner -keystore upload-keystore.jks \
              -storepass "$STORE_PASSWORD" \
              -keypass "$PRIMARY_KEY_PASSWORD" \
              /tmp/keycheck/probe.jar "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "KEY_PASSWORD_MODE=primary" >> "$GITHUB_ENV"
          else
            rm -f /tmp/keycheck/probe.jar
            (cd /tmp/keycheck && jar --create --file probe.jar probe.txt)
            if jarsigner -keystore upload-keystore.jks \
                -storepass "$STORE_PASSWORD" \
                -keypass "$STORE_PASSWORD" \
                /tmp/keycheck/probe.jar "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "KEY_PASSWORD_MODE=store" >> "$GITHUB_ENV"
            else
              echo "ERROR: Neither configured password can unlock the private signing key."
              exit 1
            fi
          fi

      - name: Prepare unsigned release bundle
        working-directory: frontend/android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          gradle = pathlib.Path("app/build.gradle")
          text = gradle.read_text()

          def named_block_span(source: str, name: str, start: int = 0):
              match = re.search(rf"\b{re.escape(name)}\s*\{{", source[start:])
              if not match:
                  raise SystemExit(f"could not find {name} block")
              open_brace = source.find("{", start + match.start())
              depth = 0
              for i in range(open_brace, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return open_brace, i + 1
              raise SystemExit(f"unterminated {name} block")

          build_open, build_end = named_block_span(text, "buildTypes")
          build_text = text[build_open:build_end]
          release_open, release_end = named_block_span(build_text, "release")
          release_text = build_text[release_open:release_end]

          patterns = [
              r"^\s*signingConfig\s+signingConfigs\.debug\s*$",
              r"^\s*signingConfig\s+signingConfigs\.release\s*$",
          ]
          original = release_text
          for pattern in patterns:
              release_text = re.sub(pattern, "", release_text, flags=re.MULTILINE)

          if release_text == original:
              raise SystemExit("expected generated release signing assignment was not found")

          build_text = build_text[:release_open] + release_text + build_text[release_end:]
          text = text[:build_open] + build_text + text[build_end:]
          gradle.write_text(text)
          print("release bundle will be built unsigned and signed after packaging")
          PY

      - name: Build unsigned release AAB
        working-directory: frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Sign completed AAB with Play upload key
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PRIMARY_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          aab='app/build/outputs/bundle/release/app-release.aab'
          if [ "$KEY_PASSWORD_MODE" = "primary" ]; then
            RESOLVED_KEY_PASSWORD="$PRIMARY_KEY_PASSWORD"
          elif [ "$KEY_PASSWORD_MODE" = "store" ]; then
            RESOLVED_KEY_PASSWORD="$STORE_PASSWORD"
          else
            echo "ERROR: No validated private-key password mode is available"
            exit 1
          fi

          jarsigner \
            -keystore app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$RESOLVED_KEY_PASSWORD" \
            "$aab" "$KEY_ALIAS"

          jarsigner -verify -verbose -certs "$aab" >/tmp/aab-jarsigner-verify.txt
          grep -F 'jar verified.' /tmp/aab-jarsigner-verify.txt >/dev/null

      - name: Verify signed AAB and Play certificate
        working-directory: frontend/android
        run: |
          set -euo pipefail
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$aab"
          size=$(stat -c%s "$aab")
          sha=$(sha256sum "$aab" | awk '{print $1}')
          echo "AAB: $aab"
          echo "Size: $size bytes"
          echo "SHA-256: $sha"

          signer_info="$(keytool -printcert -jarfile "$aab" 2>/dev/null)"
          actual_aab_sha1="$(printf '%s\n' "$signer_info" | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '\r')"
          actual_aab_sha256="$(printf '%s\n' "$signer_info" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d '\r')"
          test -n "$actual_aab_sha1" && test -n "$actual_aab_sha256" || {
            echo "ERROR: Unable to read public signer certificate fingerprints from final AAB"
            exit 1
          }
          echo "FINAL_AAB_SIGNER_SHA1=$actual_aab_sha1"
          echo "FINAL_AAB_SIGNER_SHA256=$actual_aab_sha256"
          if [ "$actual_aab_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "ERROR: Final AAB was signed with the wrong certificate."
            echo "Expected by Google Play: $EXPECTED_PLAY_UPLOAD_SHA1"
            echo "Final AAB signer:        $actual_aab_sha1"
            exit 1
          fi

          curl -sSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          java -jar /tmp/bundletool.jar validate --bundle="$aab"
          unzip -p "$aab" BundleConfig.pb > /dev/null
          java -jar /tmp/bundletool.jar dump manifest --bundle="$aab" | tee /tmp/aab-manifest.xml
          grep -F 'package="com.trackmyrmc.concreteking"' /tmp/aab-manifest.xml
          grep -F 'android:versionCode="87"' /tmp/aab-manifest.xml
          grep -F 'android:versionName="2.0.29"' /tmp/aab-manifest.xml

          bundle_entry=$(unzip -Z1 "$aab" | grep -E '(^|/)assets/index\.android\.bundle$' | head -n1)
          test -n "$bundle_entry" || { echo "Android JS bundle not found in AAB"; exit 1; }
          unzip -p "$aab" "$bundle_entry" >/tmp/index.android.bundle
          grep -F 'https://trackmyrmc.com' /tmp/index.android.bundle >/dev/null || {
            echo "Canonical production origin is not baked into the Android bundle"
            exit 1
          }
          if grep -F 'https://api.trackmyrmc.com' /tmp/index.android.bundle >/dev/null; then
            echo "Legacy api.trackmyrmc.com origin detected in Android release bundle"
            exit 1
          fi

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.29-vc87-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
