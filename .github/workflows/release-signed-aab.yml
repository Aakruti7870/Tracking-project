name: Release Signed AAB

# Produces a Google Play upload-signed .aab for com.trackmyrmc.concreteking.
# Required GitHub Actions secrets:
#   ANDROID_KEYSTORE_BASE64      - base64 of the Play upload keystore
#   ANDROID_KEYSTORE_PASSWORD    - key password (or same as store password)
#   ANDROID_STORE_PASSWORD       - keystore/store password
#   ANDROID_KEY_ALIAS            - alias inside the Play upload keystore
#
# The workflow validates BOTH the restored keystore and the final AAB certificate.
# Gradle builds the release bundle unsigned; jarsigner performs the final AAB signing.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag or SHA to release-sign
        required: false
        default: main
  push:
    branches:
      - "release/signed-aab-v*"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-signed-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      EXPECTED_PLAY_UPLOAD_SHA1: "3D:5F:80:59:1C:BA:69:1B:03:28:4D:A1:74:91:38:1D:8F:A1:32:DC"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify canonical production backend
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/api/health" >/tmp/production-health.json
          grep -F 'healthy' /tmp/production-health.json >/dev/null
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/.well-known/assetlinks.json" >/tmp/assetlinks.json
          grep -F 'com.trackmyrmc.concreteking' /tmp/assetlinks.json >/dev/null

      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ] || missing+=("ANDROID_STORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || missing+=("ANDROID_KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks
          echo "keystore size: $(stat -c%s upload-keystore.jks) bytes"

      - name: Verify Play upload keystore fingerprint
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          actual_sha1="$({ keytool -list -v \
            -keystore upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD"; } 2>/dev/null | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '\r')"
          test -n "$actual_sha1" || {
            echo "Unable to read SHA1 from configured upload keystore/alias"
            exit 1
          }
          echo "Configured upload certificate SHA1: $actual_sha1"
          if [ "$actual_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "ERROR: Wrong Android signing keystore configured."
            echo "Expected by Google Play: $EXPECTED_PLAY_UPLOAD_SHA1"
            echo "Configured keystore:       $actual_sha1"
            exit 1
          fi

      - name: Verify private key password before build
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PRIMARY_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          rm -rf /tmp/keycheck
          mkdir -p /tmp/keycheck
          printf 'TrackMyRMC signing probe\n' >/tmp/keycheck/probe.txt
          (cd /tmp/keycheck && jar --create --file probe.jar probe.txt)

          if jarsigner -keystore upload-keystore.jks \
              -storepass "$STORE_PASSWORD" \
              -keypass "$PRIMARY_KEY_PASSWORD" \
              /tmp/keycheck/probe.jar "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "KEY_PASSWORD_MODE=primary" >> "$GITHUB_ENV"
            echo "Private key password check: PASS"
          else
            rm -f /tmp/keycheck/probe.jar
            (cd /tmp/keycheck && jar --create --file probe.jar probe.txt)
            if jarsigner -keystore upload-keystore.jks \
                -storepass "$STORE_PASSWORD" \
                -keypass "$STORE_PASSWORD" \
                /tmp/keycheck/probe.jar "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "KEY_PASSWORD_MODE=store" >> "$GITHUB_ENV"
              echo "Private key password check: PASS (store password is also key password)"
            else
              echo "ERROR: Keystore and certificate are valid, but neither configured password can unlock the private signing key."
              exit 1
            fi
          fi

      - name: Prepare unsigned release build
        working-directory: frontend/android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          gradle = pathlib.Path("app/build.gradle")
          text = gradle.read_text()

          def named_block_span(source: str, name: str, start: int = 0):
              match = re.search(rf"\b{re.escape(name)}\s*\{{", source[start:])
              if not match:
                  raise SystemExit(f"could not find {name} block")
              open_brace = source.find("{", start + match.start())
              depth = 0
              for i in range(open_brace, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return open_brace, i + 1
              raise SystemExit(f"unterminated {name} block")

          build_open, build_end = named_block_span(text, "buildTypes")
          build_text = text[build_open:build_end]
          release_open, release_end = named_block_span(build_text, "release")
          release_text = build_text[release_open:release_end]

          release_text, removed = re.subn(
              r"(?m)^\s*signingConfig\s+signingConfigs\.\w+\s*$",
              "",
              release_text,
          )
          if removed < 1:
              raise SystemExit("expected a generated release signingConfig assignment to remove")
          if "signingConfig signingConfigs." in release_text:
              raise SystemExit("release build still contains a signingConfig assignment")

          build_text = build_text[:release_open] + release_text + build_text[release_end:]
          text = text[:build_open] + build_text + text[build_end:]
          gradle.write_text(text)
          print("release bundle configured to build unsigned; final signing will use jarsigner")

          props = pathlib.Path("gradle.properties")
          ptext = props.read_text()

          settings = {
              "org.gradle.jvmargs": "-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8",
              "org.gradle.caching": "true",
              "org.gradle.parallel": "true",
              "org.gradle.configureondemand": "true",
              "reactNativeArchitectures": "armeabi-v7a,arm64-v8a",
          }
          for key, value in settings.items():
              line = f"{key}={value}"
              pattern = rf"(?m)^{re.escape(key)}=.*$"
              if re.search(pattern, ptext):
                  ptext = re.sub(pattern, line, ptext)
              else:
                  if not ptext.endswith("\n"):
                      ptext += "\n"
                  ptext += line + "\n"
          props.write_text(ptext)
          print("fast build enabled: Gradle cache/parallel + ARM ABIs only")
          PY

      - name: Build unsigned release AAB
        working-directory: frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache \
            --parallel \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Sign AAB with verified Play upload key
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PRIMARY_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$aab"

          if [ "$KEY_PASSWORD_MODE" = "primary" ]; then
            KEY_PASSWORD="$PRIMARY_KEY_PASSWORD"
          elif [ "$KEY_PASSWORD_MODE" = "store" ]; then
            KEY_PASSWORD="$STORE_PASSWORD"
          else
            echo "ERROR: No validated private-key password mode is available"
            exit 1
          fi

          jarsigner \
            -keystore app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$aab" "$KEY_ALIAS"

          jarsigner -verify "$aab" >/dev/null
          echo "AAB jarsigner verification: PASS"

      - name: Verify signed AAB and Play certificate
        working-directory: frontend/android
        run: |
          set -euo pipefail
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$aab"
          size=$(stat -c%s "$aab")
          sha=$(sha256sum "$aab" | awk '{print $1}')
          echo "AAB: $aab"
          echo "Size: $size bytes"
          echo "SHA-256: $sha"

          actual_aab_sha1="$(keytool -printcert -jarfile "$aab" 2>/dev/null | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '\r')"
          test -n "$actual_aab_sha1" || {
            echo "ERROR: Unable to read signer certificate from final AAB"
            exit 1
          }
          echo "Final AAB signer SHA1: $actual_aab_sha1"
          if [ "$actual_aab_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "ERROR: Final AAB was signed with the wrong certificate."
            echo "Expected by Google Play: $EXPECTED_PLAY_UPLOAD_SHA1"
            echo "Final AAB signer:        $actual_aab_sha1"
            exit 1
          fi

          curl -sSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          java -jar /tmp/bundletool.jar validate --bundle="$aab"
          java -jar /tmp/bundletool.jar dump manifest --bundle="$aab" | tee /tmp/aab-manifest.xml
          grep -F 'package="com.trackmyrmc.concreteking"' /tmp/aab-manifest.xml
          grep -F 'android:versionCode="84"' /tmp/aab-manifest.xml
          grep -F 'android:versionName="2.0.26"' /tmp/aab-manifest.xml

          bundle_entry=$(unzip -Z1 "$aab" | grep -E '(^|/)assets/index\.android\.bundle$' | head -n1)
          test -n "$bundle_entry" || { echo "Android JS bundle not found in AAB"; exit 1; }
          unzip -p "$aab" "$bundle_entry" >/tmp/index.android.bundle
          grep -F 'https://trackmyrmc.com' /tmp/index.android.bundle >/dev/null || {
            echo "Canonical production origin is not baked into the Android bundle"
            exit 1
          }
          if grep -F 'https://api.trackmyrmc.com' /tmp/index.android.bundle >/dev/null; then
            echo "Legacy api.trackmyrmc.com origin detected in Android release bundle"
            exit 1
          fi

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.26-vc84-fast-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
