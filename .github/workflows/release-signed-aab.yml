name: Release Signed AAB

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag or SHA to release-sign
        required: false
        default: main
      upload_to_play:
        description: Upload verified AAB to Google Play Internal Testing
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "release/signed-aab-v*"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-signed-aab-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
  GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
  EXPECTED_PLAY_UPLOAD_SHA1: "3D:5F:80:59:1C:BA:69:1B:03:28:4D:A1:74:91:38:1D:8F:A1:32:DC"
  PACKAGE_NAME: com.trackmyrmc.concreteking
  VERSION_CODE: "89"
  VERSION_NAME: "2.0.31"

jobs:
  build-signed-aab:
    name: Build and verify signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install release image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1

      - name: Verify production backend
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS "${EXPO_PUBLIC_BACKEND_URL}/api/health" >/tmp/health.json
          grep -F 'healthy' /tmp/health.json >/dev/null
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS "${EXPO_PUBLIC_BACKEND_URL}/.well-known/assetlinks.json" >/tmp/assetlinks.json
          grep -F "${PACKAGE_NAME}" /tmp/assetlinks.json >/dev/null

      - name: Verify required signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ] || missing+=(ANDROID_STORE_PASSWORD)
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || missing+=(ANDROID_KEY_ALIAS)
          if [ ${#missing[@]} -gt 0 ]; then echo "Missing required signing secrets: ${missing[*]}"; exit 1; fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run release invariants
        working-directory: frontend
        run: node scripts/check-fresh-production-release.mjs

      - name: Run Play policy readiness gate
        working-directory: frontend
        run: node scripts/check-play-policy-readiness.mjs

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks

      - name: Verify upload certificate
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          info="$(keytool -list -v -keystore upload-keystore.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>/dev/null)"
          sha1="$(printf '%s\n' "$info" | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '\r')"
          sha256="$(printf '%s\n' "$info" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d '\r')"
          test -n "$sha1" && test -n "$sha256"
          echo "Upload SHA1: $sha1"
          echo "Upload SHA256: $sha256"
          test "$sha1" = "$EXPECTED_PLAY_UPLOAD_SHA1" || { echo "ERROR: upload certificate does not match Google Play certificate"; exit 1; }

      - name: Detect private-key password
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          rm -rf /tmp/keycheck && mkdir -p /tmp/keycheck
          printf 'probe\n' >/tmp/keycheck/probe.txt
          (cd /tmp/keycheck && jar --create --file probe.jar probe.txt)
          if jarsigner -keystore upload-keystore.jks -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" /tmp/keycheck/probe.jar "$KEY_ALIAS" >/dev/null 2>&1; then
            echo KEY_PASSWORD_MODE=primary >> "$GITHUB_ENV"
          else
            rm -f /tmp/keycheck/probe.jar
            (cd /tmp/keycheck && jar --create --file probe.jar probe.txt)
            jarsigner -keystore upload-keystore.jks -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" /tmp/keycheck/probe.jar "$KEY_ALIAS" >/dev/null 2>&1 || { echo "ERROR: private signing key cannot be unlocked"; exit 1; }
            echo KEY_PASSWORD_MODE=store >> "$GITHUB_ENV"
          fi

      - name: Build unsigned release AAB
        working-directory: frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          start=s.find('release {')
          marker='signingConfig signingConfigs.debug'
          pos=s.find(marker,start)
          if start < 0 or pos < 0:
              raise SystemExit('ERROR: release debug signingConfig not found')
          p.write_text(s[:pos]+s[pos+len(marker):])
          PY
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Sign AAB with verified upload key
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          if [ "$KEY_PASSWORD_MODE" = primary ]; then keypass="$KEY_PASSWORD"; else keypass="$STORE_PASSWORD"; fi
          jarsigner -keystore app/upload-keystore.jks -storetype JKS -storepass "$STORE_PASSWORD" -keypass "$keypass" "$aab" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$aab"

      - name: Validate final AAB
        working-directory: frontend/android
        run: |
          set -euo pipefail
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$aab"
          signer="$(keytool -printcert -jarfile "$aab" 2>/dev/null)"
          sha1="$(printf '%s\n' "$signer" | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '\r')"
          test "$sha1" = "$EXPECTED_PLAY_UPLOAD_SHA1" || { echo "ERROR: final AAB signer does not match Google Play upload certificate"; exit 1; }
          curl -fsSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          java -jar /tmp/bundletool.jar validate --bundle="$aab"
          java -jar /tmp/bundletool.jar dump manifest --bundle="$aab" | tee /tmp/manifest.xml
          grep -F "package=\"${PACKAGE_NAME}\"" /tmp/manifest.xml
          grep -F 'android:versionCode="89"' /tmp/manifest.xml
          grep -F 'android:versionName="2.0.31"' /tmp/manifest.xml
          entry=$(unzip -Z1 "$aab" | grep -E '(^|/)assets/index\.android\.bundle$' | head -n1)
          test -n "$entry" || { echo "ERROR: Android JS bundle not found"; exit 1; }
          unzip -p "$aab" "$entry" >/tmp/index.android.bundle
          grep -F 'https://trackmyrmc.com' /tmp/index.android.bundle >/dev/null || { echo "ERROR: canonical production origin missing"; exit 1; }
          if grep -F 'https://api.trackmyrmc.com' /tmp/index.android.bundle >/dev/null; then
            echo "Legacy api.trackmyrmc.com origin detected"
            exit 1
          fi
          echo "AAB_VALIDATION=PASS"
          echo "AAB_SHA256=$(sha256sum "$aab" | awk '{print $1}')"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.31-vc89-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Authenticate Google Play
        id: auth
        if: ${{ inputs.upload_to_play == true }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: true
          cleanup_credentials: true

      - name: Upload AAB to Google Play Internal Testing
        if: ${{ inputs.upload_to_play == true }}
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}"
          response=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' "${API}/edits")
          status=$(printf '%s\n' "$response" | sed -n 's/^HTTP_STATUS://p')
          body=$(printf '%s\n' "$response" | sed '/^HTTP_STATUS:/d')
          if [ "$status" != 200 ]; then
            echo "Google Play API /edits returned HTTP $status"
            printf '%s\n' "$body"
            if [ "$status" = 403 ]; then echo "Google service account is authenticated but lacks Play Console app permission for ${PACKAGE_NAME}."; fi
            exit 1
          fi
          edit_id=$(printf '%s' "$body" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          upload=$(curl -fsS -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/octet-stream' --data-binary @"frontend/android/app/build/outputs/bundle/release/app-release.aab" "${API}/edits/${edit_id}/bundles?uploadType=media")
          uploaded=$(printf '%s' "$upload" | python3 -c 'import sys,json; print(json.load(sys.stdin)["versionCode"])')
          test "$uploaded" = "$VERSION_CODE"
          body=$(python3 - <<PY
          import json
          print(json.dumps({'releases':[{'versionCodes':['${VERSION_CODE}'],'status':'completed'}]}))
          PY
          )
          curl -fsS -X PUT -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' -d "$body" "${API}/edits/${edit_id}/tracks/internal" >/tmp/play-track.json
          curl -fsS -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' "${API}/edits/${edit_id}:validate" >/tmp/play-validation.json
          curl -fsS -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' "${API}/edits/${edit_id}:commit" >/tmp/play-commit.json
          echo "GOOGLE PLAY INTERNAL TESTING UPLOAD: SUCCESS"
