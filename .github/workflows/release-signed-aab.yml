name: Release Signed AAB

# Produces a Google Play upload-signed .aab for com.trackmyrmc.concreteking.
# Required GitHub Actions secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64      - base64 of the upload keystore .jks / .p12
#   ANDROID_KEYSTORE_PASSWORD    - keystore password
#   ANDROID_STORE_PASSWORD       - key store password (usually same as ANDROID_KEYSTORE_PASSWORD)
#   ANDROID_KEY_ALIAS            - alias inside the keystore (e.g. "concreteking")
#
# Production release builds are intentionally pinned to https://trackmyrmc.com.
# Do not bake a preview, legacy, or api.* hostname into a Play candidate.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag or SHA to release-sign
        required: false
        default: main
  push:
    branches:
      - "release/signed-aab-v*"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-signed-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify canonical production backend
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/api/health" >/tmp/production-health.json
          grep -F 'healthy' /tmp/production-health.json >/dev/null
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/.well-known/assetlinks.json" >/tmp/assetlinks.json
          grep -F 'com.trackmyrmc.concreteking' /tmp/assetlinks.json >/dev/null

      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ] || missing+=("ANDROID_STORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || missing+=("ANDROID_KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required signing secrets: ${missing[*]}"
            echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Restore valid launcher PNGs for release build
        working-directory: frontend
        env:
          ICON_B64: 
          ADAPTIVE_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$ICON_B64" | base64 -d > assets/images/icon.png
          printf '%s' "$ADAPTIVE_B64" | base64 -d > assets/images/adaptive-icon.png
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('assets/images/icon.png'), Path('assets/images/adaptive-icon.png')]:
              data = p.read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'invalid PNG signature: {p}')
              print(f'{p}: {len(data)} bytes, valid PNG signature')
          PY

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks
          echo "keystore size: $(stat -c%s upload-keystore.jks) bytes"

      - name: Wire release signingConfig into build.gradle
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat >> gradle.properties <<EOF
          TRACKMYRMC_UPLOAD_STORE_FILE=upload-keystore.jks
          TRACKMYRMC_UPLOAD_STORE_PASSWORD=${STORE_PASSWORD}
          TRACKMYRMC_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          TRACKMYRMC_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
          EOF
          python3 - <<'PY'
          import re, pathlib
          gradle = pathlib.Path("app/build.gradle")
          text = gradle.read_text()
          if "TRACKMYRMC_UPLOAD_STORE_FILE" in text:
              print("signingConfig already wired, skipping")
          else:
              signing_block = """
              signingConfigs {
                  release {
                      if (project.hasProperty('TRACKMYRMC_UPLOAD_STORE_FILE')) {
                          storeFile file(TRACKMYRMC_UPLOAD_STORE_FILE)
                          storePassword TRACKMYRMC_UPLOAD_STORE_PASSWORD
                          keyAlias TRACKMYRMC_UPLOAD_KEY_ALIAS
                          keyPassword TRACKMYRMC_UPLOAD_KEY_PASSWORD
                      }
                  }
              }
              """
              text2 = re.sub(r'(\n\s*buildTypes\s*\{)', signing_block + r'\1', text, count=1)
              text2 = re.sub(
                  r'(buildTypes\s*\{[^{}]*release\s*\{[^{}]*?)(signingConfig\s+signingConfigs\.\w+)',
                  r'\1signingConfig signingConfigs.release',
                  text2,
                  count=1,
                  flags=re.DOTALL,
              )
              if text2 == text:
                  raise SystemExit("failed to patch app/build.gradle with release signingConfig")
              gradle.write_text(text2)
              print("signingConfig wired into app/build.gradle")
          PY

      - name: Build signed release AAB
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed AAB
        working-directory: frontend/android
        run: |
          set -euo pipefail
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$aab"
          size=$(stat -c%s "$aab")
          sha=$(sha256sum "$aab" | awk '{print $1}')
          echo "AAB: $aab"
          echo "Size: $size bytes"
          echo "SHA-256: $sha"

          curl -sSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          java -jar /tmp/bundletool.jar validate --bundle="$aab"
          unzip -p "$aab" BundleConfig.pb > /dev/null
          java -jar /tmp/bundletool.jar dump manifest --bundle="$aab" | tee /tmp/aab-manifest.xml
          grep -F 'package="com.trackmyrmc.concreteking"' /tmp/aab-manifest.xml
          grep -F 'android:versionCode="83"' /tmp/aab-manifest.xml
          grep -F 'android:versionName="2.0.25"' /tmp/aab-manifest.xml

          bundle_entry=$(unzip -Z1 "$aab" | grep -E '(^|/)assets/index\.android\.bundle$' | head -n1)
          test -n "$bundle_entry" || { echo "Android JS bundle not found in AAB"; exit 1; }
          unzip -p "$aab" "$bundle_entry" >/tmp/index.android.bundle
          grep -F 'https://trackmyrmc.com' /tmp/index.android.bundle >/dev/null || {
            echo "Canonical production origin is not baked into the Android bundle"
            exit 1
          }
          if grep -F 'https://api.trackmyrmc.com' /tmp/index.android.bundle >/dev/null; then
            echo "Legacy api.trackmyrmc.com origin detected in Android release bundle"
            exit 1
          fi

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.25-vc83-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
