name: Release Signed AAB

# Produces a Google Play upload-signed .aab for com.trackmyrmc.concreteking.
# The release bundle is built unsigned first and then explicitly JAR-signed with
# the verified Google Play upload key. This avoids AGP FinalizeBundleTask signing
# failures while keeping signer verification fail-closed.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag or SHA to release-sign
        required: false
        default: main
  push:
    branches:
      - "release/signed-aab-v*"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-signed-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      EXPECTED_PLAY_UPLOAD_SHA1: "3D:5F:80:59:1C:BA:69:1B:03:28:4D:A1:74:91:38:1D:8F:A1:32:DC"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify canonical production backend
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/api/health" >/tmp/production-health.json
          grep -F 'healthy' /tmp/production-health.json >/dev/null
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/.well-known/assetlinks.json" >/tmp/assetlinks.json
          grep -F 'com.trackmyrmc.concreteking' /tmp/assetlinks.json >/dev/null

      - name: Verify required secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ] || missing+=("ANDROID_STORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || missing+=("ANDROID_KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks
          chmod 600 upload-keystore.jks
          echo "keystore size: $(stat -c%s upload-keystore.jks) bytes"

      - name: Verify Google Play upload certificate before build
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha1="$(keytool -list -v \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>/dev/null \
            | awk -F': ' '/SHA1:/{print $2; exit}' \
            | tr '[:lower:]' '[:upper:]')"
          test -n "$actual_sha1"
          echo "Configured upload certificate SHA1: $actual_sha1"
          echo "Google Play expected certificate SHA1: $EXPECTED_PLAY_UPLOAD_SHA1"
          if [ "$actual_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "::error::WRONG GOOGLE PLAY UPLOAD KEY. Expected $EXPECTED_PLAY_UPLOAD_SHA1 but configured keystore is $actual_sha1"
            exit 1
          fi
          echo "Google Play upload certificate verified."

      - name: Disable Expo debug signing for release bundle
        working-directory: frontend/android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          gradle = pathlib.Path("app/build.gradle")
          text = gradle.read_text()

          def block_bounds(source, match):
              open_brace = source.find("{", match.start())
              if open_brace < 0:
                  raise SystemExit("opening brace not found")
              depth = 0
              for index in range(open_brace, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return open_brace, index
              raise SystemExit("closing brace not found")

          buildtypes_match = re.search(r'(?m)^\s*buildTypes\s*\{', text)
          if not buildtypes_match:
              raise SystemExit("buildTypes block not found")
          bt_open, bt_close = block_bounds(text, buildtypes_match)
          bt_body = text[bt_open + 1:bt_close]

          release_match = re.search(r'(?m)^\s*release\s*\{', bt_body)
          if not release_match:
              raise SystemExit("buildTypes.release block not found")
          rel_open, rel_close = block_bounds(bt_body, release_match)
          release_body = bt_body[rel_open + 1:rel_close]

          release_body, removed = re.subn(
              r'(?m)^\s*signingConfig\s+signingConfigs\.\w+\s*\n?',
              '',
              release_body,
          )
          if removed < 1:
              raise SystemExit("release signingConfig line not found")

          bt_body = bt_body[:rel_open + 1] + release_body + bt_body[rel_close:]
          text = text[:bt_open + 1] + bt_body + text[bt_close:]
          gradle.write_text(text)

          patched = gradle.read_text()
          buildtypes_match = re.search(r'(?m)^\s*buildTypes\s*\{', patched)
          bt_open, bt_close = block_bounds(patched, buildtypes_match)
          bt_body = patched[bt_open + 1:bt_close]
          release_match = re.search(r'(?m)^\s*release\s*\{', bt_body)
          rel_open, rel_close = block_bounds(bt_body, release_match)
          release_body = bt_body[rel_open + 1:rel_close]
          if "signingConfig" in release_body:
              raise SystemExit("buildTypes.release still contains signingConfig")
          print("buildTypes.release will produce an unsigned AAB for explicit CI signing")
          PY

      - name: Build unsigned production AAB
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Sign AAB with Google Play upload key
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          aab='app/build/outputs/bundle/release/app-release.aab'
          keystore='app/upload-keystore.jks'
          test -s "$aab"
          test -s "$keystore"
          jarsigner \
            -keystore "$keystore" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$aab" "$KEY_ALIAS"
          # The Google Play upload certificate is intentionally self-signed; do not use
          # jarsigner -strict here because PKIX trust-chain validation is not applicable.
          # The next step fail-closes on the exact expected SHA-1 and bundletool validity.
          jarsigner -verify -certs "$aab"
          echo "AAB explicitly signed with configured upload private key."

      - name: Verify signed AAB
        working-directory: frontend/android
        shell: bash
        run: |
          set -euo pipefail
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$aab"
          size=$(stat -c%s "$aab")
          sha=$(sha256sum "$aab" | awk '{print $1}')
          echo "AAB: $aab"
          echo "Size: $size bytes"
          echo "SHA-256: $sha"

          signer_sha1="$(keytool -printcert -jarfile "$aab" 2>/dev/null \
            | awk -F': ' '/SHA1:/{print $2; exit}' \
            | tr '[:lower:]' '[:upper:]')"
          if [ -z "$signer_sha1" ]; then
            echo "::error::Unable to read signing certificate from generated AAB."
            exit 1
          fi
          echo "Generated AAB signer SHA1: $signer_sha1"
          if [ "$signer_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "::error::Generated AAB is signed by the wrong certificate. Expected $EXPECTED_PLAY_UPLOAD_SHA1 but got $signer_sha1"
            exit 1
          fi
          echo "Generated AAB signing certificate matches Google Play upload certificate."

          curl -fsSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          java -jar /tmp/bundletool.jar validate --bundle="$aab"
          java -jar /tmp/bundletool.jar dump manifest --bundle="$aab" | tee /tmp/aab-manifest.xml
          grep -F 'package="com.trackmyrmc.concreteking"' /tmp/aab-manifest.xml
          grep -F 'android:versionCode="82"' /tmp/aab-manifest.xml
          grep -F 'android:versionName="2.0.24"' /tmp/aab-manifest.xml

          bundle_entry=$(unzip -Z1 "$aab" | grep -E '(^|/)assets/index\.android\.bundle$' | head -n1)
          test -n "$bundle_entry" || { echo "Android JS bundle not found in AAB"; exit 1; }
          unzip -p "$aab" "$bundle_entry" >/tmp/index.android.bundle
          grep -F 'https://trackmyrmc.com' /tmp/index.android.bundle >/dev/null || {
            echo "Canonical production origin is not baked into the Android bundle"
            exit 1
          }
          if grep -F 'https://api.trackmyrmc.com' /tmp/index.android.bundle >/dev/null; then
            echo "Legacy api.trackmyrmc.com origin detected in Android release bundle"
            exit 1
          fi

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.24-vc82-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
