name: Release Signed AAB

# Produces a Google Play upload-signed .aab for com.trackmyrmc.concreteking.
# Required GitHub Actions secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64      - base64 of the ORIGINAL Google Play upload keystore .jks / .p12
#   ANDROID_KEYSTORE_PASSWORD    - key password
#   ANDROID_STORE_PASSWORD       - keystore password
#   ANDROID_KEY_ALIAS            - alias inside the keystore
#
# IMPORTANT: Google Play currently requires the upload certificate SHA-1 below.
# The workflow fails before Gradle if a different keystore is configured, and verifies
# the final AAB signer again after the bundle is built.
#
# Production release builds are intentionally pinned to https://trackmyrmc.com.
# Do not bake a preview, legacy, or api.* hostname into a Play candidate.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag or SHA to release-sign
        required: false
        default: main
  push:
    branches:
      - "release/signed-aab-v*"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-signed-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      EXPECTED_PLAY_UPLOAD_SHA1: "3D:5F:80:59:1C:BA:69:1B:03:28:4D:A1:74:91:38:1D:8F:A1:32:DC"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify canonical production backend
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/api/health" >/tmp/production-health.json
          grep -F 'healthy' /tmp/production-health.json >/dev/null
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/.well-known/assetlinks.json" >/tmp/assetlinks.json
          grep -F 'com.trackmyrmc.concreteking' /tmp/assetlinks.json >/dev/null

      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ] || missing+=("ANDROID_STORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || missing+=("ANDROID_KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required signing secrets: ${missing[*]}"
            echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks
          echo "keystore size: $(stat -c%s upload-keystore.jks) bytes"

      - name: Verify Google Play upload certificate before build
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          actual_sha1="$(keytool -list -v \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" 2>/dev/null \
            | awk -F': ' '/SHA1:/{print $2; exit}' \
            | tr '[:lower:]' '[:upper:]')"

          if [ -z "$actual_sha1" ]; then
            echo "::error::Could not read SHA-1 from configured Android upload keystore/alias."
            exit 1
          fi

          echo "Configured upload certificate SHA1: $actual_sha1"
          echo "Google Play expected certificate SHA1: $EXPECTED_PLAY_UPLOAD_SHA1"
          if [ "$actual_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "::error::WRONG GOOGLE PLAY UPLOAD KEY. Refusing to build AAB. Expected $EXPECTED_PLAY_UPLOAD_SHA1 but configured keystore is $actual_sha1"
            exit 1
          fi

          echo "Google Play upload certificate verified."

      - name: Wire release signingConfig into build.gradle
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat >> gradle.properties <<EOF
          TRACKMYRMC_UPLOAD_STORE_FILE=upload-keystore.jks
          TRACKMYRMC_UPLOAD_STORE_PASSWORD=${STORE_PASSWORD}
          TRACKMYRMC_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          TRACKMYRMC_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
          EOF
          python3 - <<'PY'
          import pathlib
          import re

          gradle = pathlib.Path("app/build.gradle")
          text = gradle.read_text()

          if "TRACKMYRMC_UPLOAD_STORE_FILE" not in text:
              signing_block = """
              signingConfigs {
                  release {
                      if (project.hasProperty('TRACKMYRMC_UPLOAD_STORE_FILE')) {
                          storeFile file(TRACKMYRMC_UPLOAD_STORE_FILE)
                          storePassword TRACKMYRMC_UPLOAD_STORE_PASSWORD
                          keyAlias TRACKMYRMC_UPLOAD_KEY_ALIAS
                          keyPassword TRACKMYRMC_UPLOAD_KEY_PASSWORD
                      }
                  }
              }
              """
              text, inserted = re.subn(
                  r'(\n\s*buildTypes\s*\{)',
                  signing_block + r'\1',
                  text,
                  count=1,
              )
              if inserted != 1:
                  raise SystemExit("failed to insert release signingConfigs block")

          # Expo prebuild emits a debug block before release, so a regex that assumes
          # no nested braces inside buildTypes can miss the release signingConfig.
          # Locate the release block and replace its signer explicitly.
          release_match = re.search(r'(?m)^\s*release\s*\{', text)
          if not release_match:
              raise SystemExit("release buildType block not found")

          open_brace = text.find('{', release_match.start())
          depth = 0
          close_brace = None
          for index in range(open_brace, len(text)):
              if text[index] == '{':
                  depth += 1
              elif text[index] == '}':
                  depth -= 1
                  if depth == 0:
                      close_brace = index
                      break
          if close_brace is None:
              raise SystemExit("release buildType block is malformed")

          release_body = text[open_brace + 1:close_brace]
          release_body, replaced = re.subn(
              r'(?m)^(\s*)signingConfig\s+signingConfigs\.\w+\s*$',
              r'\1signingConfig signingConfigs.release',
              release_body,
              count=1,
          )
          if replaced != 1:
              raise SystemExit("release signingConfig line not found")

          text = text[:open_brace + 1] + release_body + text[close_brace:]
          gradle.write_text(text)

          # Fail here instead of spending ~20 minutes building a debug-signed AAB.
          patched = gradle.read_text()
          release_match = re.search(r'(?m)^\s*release\s*\{', patched)
          open_brace = patched.find('{', release_match.start())
          depth = 0
          close_brace = None
          for index in range(open_brace, len(patched)):
              if patched[index] == '{':
                  depth += 1
              elif patched[index] == '}':
                  depth -= 1
                  if depth == 0:
                      close_brace = index
                      break
          release_body = patched[open_brace + 1:close_brace]
          if "signingConfig signingConfigs.release" not in release_body:
              raise SystemExit("release buildType is not wired to signingConfigs.release")
          if "signingConfig signingConfigs.debug" in release_body:
              raise SystemExit("release buildType still references debug signingConfig")
          print("release buildType is wired to the Google Play upload signingConfig")
          PY

      - name: Build signed release AAB
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed AAB
        working-directory: frontend/android
        run: |
          set -euo pipefail
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$aab"
          size=$(stat -c%s "$aab")
          sha=$(sha256sum "$aab" | awk '{print $1}')
          echo "AAB: $aab"
          echo "Size: $size bytes"
          echo "SHA-256: $sha"
          echo "aab_sha=$sha" >> "$GITHUB_OUTPUT" || true

          signer_sha1="$(keytool -printcert -jarfile "$aab" 2>/dev/null \
            | awk -F': ' '/SHA1:/{print $2; exit}' \
            | tr '[:lower:]' '[:upper:]')"
          if [ -z "$signer_sha1" ]; then
            echo "::error::Unable to read signing certificate from generated AAB."
            exit 1
          fi
          echo "Generated AAB signer SHA1: $signer_sha1"
          if [ "$signer_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "::error::Generated AAB is signed by the wrong certificate. Expected $EXPECTED_PLAY_UPLOAD_SHA1 but got $signer_sha1"
            exit 1
          fi
          echo "Generated AAB signing certificate matches Google Play."

          curl -sSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          java -jar /tmp/bundletool.jar validate --bundle="$aab"
          unzip -p "$aab" BundleConfig.pb > /dev/null
          java -jar /tmp/bundletool.jar dump manifest --bundle="$aab" | tee /tmp/aab-manifest.xml
          grep -F 'package="com.trackmyrmc.concreteking"' /tmp/aab-manifest.xml
          grep -F 'android:versionCode="82"' /tmp/aab-manifest.xml
          grep -F 'android:versionName="2.0.24"' /tmp/aab-manifest.xml

          bundle_entry=$(unzip -Z1 "$aab" | grep -E '(^|/)assets/index\.android\.bundle$' | head -n1)
          test -n "$bundle_entry" || { echo "Android JS bundle not found in AAB"; exit 1; }
          unzip -p "$aab" "$bundle_entry" >/tmp/index.android.bundle
          grep -F 'https://trackmyrmc.com' /tmp/index.android.bundle >/dev/null || {
            echo "Canonical production origin is not baked into the Android bundle"
            exit 1
          }
          if grep -F 'https://api.trackmyrmc.com' /tmp/index.android.bundle >/dev/null; then
            echo "Legacy api.trackmyrmc.com origin detected in Android release bundle"
            exit 1
          fi

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.24-vc82-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
