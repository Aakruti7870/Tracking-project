name: Release Signed AAB

# Builds the Google Play upload bundle for TrackMyRMC.
# The release is rejected immediately unless both the restored upload keystore
# and the finished AAB use the certificate already registered in Play Console.

on:
  workflow_dispatch:
  push:
    branches:
      - "release/signed-aab-v*"

permissions:
  contents: read

concurrency:
  group: release-signed-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_PUBLIC_BACKEND_URL: https://trackmyrmc.com
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      TRACKMYRMC_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      TRACKMYRMC_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TRACKMYRMC_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      EXPECTED_PLAY_UPLOAD_SHA1: 3D:5F:80:59:1C:BA:69:1B:03:28:4D:A1:74:91:38:1D:8F:A1:32:DC

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify production endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/api/health" >/tmp/production-health.json
          grep -F 'healthy' /tmp/production-health.json >/dev/null
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "${EXPO_PUBLIC_BACKEND_URL}/.well-known/assetlinks.json" >/tmp/assetlinks.json
          grep -F 'com.trackmyrmc.concreteking' /tmp/assetlinks.json >/dev/null

      - name: Verify signing secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$TRACKMYRMC_UPLOAD_STORE_PASSWORD" ] || missing+=("ANDROID_STORE_PASSWORD")
          [ -n "$TRACKMYRMC_UPLOAD_KEY_PASSWORD" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$TRACKMYRMC_UPLOAD_KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Verify release metadata
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const app = require('./app.json').expo;
          if (app.android.package !== 'com.trackmyrmc.concreteking') {
            throw new Error(`Unexpected package: ${app.android.package}`);
          }
          if (app.version !== '2.0.25') {
            throw new Error(`Unexpected version: ${app.version}`);
          }
          if (app.android.versionCode !== 83) {
            throw new Error(`Unexpected versionCode: ${app.android.versionCode}`);
          }
          console.log(`package=${app.android.package} version=${app.version} versionCode=${app.android.versionCode}`);
          NODE

      - name: Verify launcher PNGs
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          for name in (
              'assets/images/icon.png',
              'assets/images/adaptive-icon.png',
              'assets/images/play-store-icon.png',
          ):
              p = Path(name)
              data = p.read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit(f'{name}: not a valid PNG stream')
              print(f'{name}: PNG signature OK ({len(data)} bytes)')
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore and verify Play certificate
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$PWD/android/app/upload-keystore.jks"
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | tr -d '\r\n ' | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          KEYTOOL_OUT="$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$TRACKMYRMC_UPLOAD_STORE_PASSWORD" \
            -alias "$TRACKMYRMC_UPLOAD_KEY_ALIAS")"
          ACTUAL_SHA1="$(printf '%s\n' "$KEYTOOL_OUT" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n1 | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "::error::Configured upload keystore has the wrong certificate. Expected $EXPECTED_PLAY_UPLOAD_SHA1, got ${ACTUAL_SHA1:-UNKNOWN}."
            exit 1
          fi
          echo "Upload keystore certificate SHA1 verified: $ACTUAL_SHA1"

      - name: Wire upload keystore into release build
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/build.gradle')
          text = path.read_text()

          def named_block(src, name, start=0, end=None):
              if end is None:
                  end = len(src)
              m = re.search(r'\b' + re.escape(name) + r'\s*\{', src[start:end])
              if not m:
                  raise SystemExit(f'Cannot find {name} block')
              open_pos = start + m.end() - 1
              depth = 0
              for i in range(open_pos, len(src)):
                  ch = src[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return open_pos, i
              raise SystemExit(f'Unclosed {name} block')

          android_open, android_close = named_block(text, 'android')
          signing_open, signing_close = named_block(text, 'signingConfigs', android_open + 1, android_close)

          release_signing = '''
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('TRACKMYRMC_UPLOAD_STORE_PASSWORD')
                  keyAlias System.getenv('TRACKMYRMC_UPLOAD_KEY_ALIAS')
                  keyPassword System.getenv('TRACKMYRMC_UPLOAD_KEY_PASSWORD')
              }
          '''
          text = text[:signing_close] + release_signing + text[signing_close:]

          # Re-locate after insertion because offsets changed.
          android_open, android_close = named_block(text, 'android')
          build_open, build_close = named_block(text, 'buildTypes', android_open + 1, android_close)
          release_open, release_close = named_block(text, 'release', build_open + 1, build_close)
          release_body = text[release_open + 1:release_close]

          signing_line = re.compile(r'(?m)^(\s*)signingConfig\s+signingConfigs\.[A-Za-z0-9_]+\s*$')
          matches = list(signing_line.finditer(release_body))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one release signingConfig line, found {len(matches)}')
          release_body = signing_line.sub(
              lambda m: f'{m.group(1)}signingConfig signingConfigs.release',
              release_body,
              count=1,
          )
          text = text[:release_open + 1] + release_body + text[release_close:]

          # Final structural assertion: inspect only buildTypes.release.
          android_open, android_close = named_block(text, 'android')
          build_open, build_close = named_block(text, 'buildTypes', android_open + 1, android_close)
          release_open, release_close = named_block(text, 'release', build_open + 1, build_close)
          final_release = text[release_open:release_close + 1]
          if 'signingConfig signingConfigs.release' not in final_release:
              raise SystemExit('Release build is not wired to signingConfigs.release')
          if 'signingConfig signingConfigs.debug' in final_release:
              raise SystemExit('Release build still references debug signing')

          path.write_text(text)
          print('Release build signingConfig verified as signingConfigs.release')
          PY

      - name: Build signed release AAB
        working-directory: frontend/android
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify finished AAB certificate
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          AAB="$PWD/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          CERT_OUT="$(keytool -printcert -jarfile "$AAB")"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUT" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n1 | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "::error::Wrong AAB signing certificate. Expected $EXPECTED_PLAY_UPLOAD_SHA1, got ${ACTUAL_SHA1:-UNKNOWN}."
            exit 1
          fi
          echo "AAB signing certificate SHA1 verified: $ACTUAL_SHA1"
          sha256sum "$AAB"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.25-vc83-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
