name: Release Signed AAB

# Produces a Google Play upload-signed .aab for com.trackmyrmc.concreteking.
# Required GitHub Actions secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64      - base64 of the Play upload keystore .jks / .p12
#   ANDROID_KEYSTORE_PASSWORD    - private-key password
#   ANDROID_STORE_PASSWORD       - keystore/store password
#   ANDROID_KEY_ALIAS            - alias inside the keystore
#
# IMPORTANT: Google Play expects the historical TrackMyRMC upload certificate below.
# This workflow hard-fails before and after the Gradle build if any other certificate is used.

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag or SHA to release-sign
        required: false
        default: main
  push:
    branches:
      - "fix/play-upload-signing-cert-gate"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-signed-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.PREVIEW_BACKEND_URL || 'https://api.trackmyrmc.com' }}
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      EXPECTED_PLAY_UPLOAD_SHA1: "3D:5F:80:59:1C:BA:69:1B:03:28:4D:A1:74:91:38:1D:8F:A1:32:DC"
    steps:
      - uses: actions/checkout@v4
        with:
          # Repair-branch validation intentionally builds the exact frozen green main SHA.
          ref: a6cdbb62aa9db2f615f436be399f374072c8213c

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_STORE_PASSWORD }}" ] || missing+=("ANDROID_STORE_PASSWORD")
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || missing+=("ANDROID_KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required signing secrets: ${missing[*]}"
            echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore upload keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf "%s" "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks
          echo "keystore size: $(stat -c%s upload-keystore.jks) bytes"

      - name: Verify Play upload keystore certificate
        working-directory: frontend/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cert_info="$(keytool -list -v -keystore upload-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS")"
          actual_sha1="$(printf '%s\n' "$cert_info" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n1 | tr -d '[:space:]')"
          echo "Expected Play upload SHA1: $EXPECTED_PLAY_UPLOAD_SHA1"
          echo "Restored keystore SHA1:     $actual_sha1"
          test -n "$actual_sha1"
          if [ "$actual_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "ERROR: GitHub signing keystore does not match the certificate registered in Google Play."
            exit 1
          fi
          echo "Play upload keystore certificate MATCHES."

      - name: Wire release signingConfig into build.gradle
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat >> gradle.properties <<EOF
          TRACKMYRMC_UPLOAD_STORE_FILE=upload-keystore.jks
          TRACKMYRMC_UPLOAD_STORE_PASSWORD=${STORE_PASSWORD}
          TRACKMYRMC_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          TRACKMYRMC_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
          EOF
          python3 - <<'PY'
          import pathlib, re

          gradle = pathlib.Path("app/build.gradle")
          text = gradle.read_text()

          signing_block = """
              signingConfigs {
                  release {
                      if (project.hasProperty('TRACKMYRMC_UPLOAD_STORE_FILE')) {
                          storeFile file(TRACKMYRMC_UPLOAD_STORE_FILE)
                          storePassword TRACKMYRMC_UPLOAD_STORE_PASSWORD
                          keyAlias TRACKMYRMC_UPLOAD_KEY_ALIAS
                          keyPassword TRACKMYRMC_UPLOAD_KEY_PASSWORD
                      }
                  }
              }
          """

          if "TRACKMYRMC_UPLOAD_STORE_FILE" not in text:
              m = re.search(r"\n\s*buildTypes\s*\{", text)
              if not m:
                  raise SystemExit("buildTypes block not found")
              text = text[:m.start()] + "\n" + signing_block + text[m.start():]

          def block_bounds(src: str, keyword_start: int):
              open_brace = src.find("{", keyword_start)
              if open_brace < 0:
                  raise SystemExit("opening brace not found")
              depth = 0
              for i in range(open_brace, len(src)):
                  if src[i] == "{":
                      depth += 1
                  elif src[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return open_brace, i
              raise SystemExit("unterminated Gradle block")

          bt = re.search(r"\bbuildTypes\s*\{", text)
          if not bt:
              raise SystemExit("buildTypes block not found after signing insertion")
          bt_open, bt_close = block_bounds(text, bt.start())
          bt_body = text[bt_open + 1:bt_close]

          rel = re.search(r"\brelease\s*\{", bt_body)
          if not rel:
              raise SystemExit("release buildType not found")
          rel_abs_start = bt_open + 1 + rel.start()
          rel_open, rel_close = block_bounds(text, rel_abs_start)
          release_body = text[rel_open + 1:rel_close]

          replacement = "signingConfig signingConfigs.release"
          if re.search(r"signingConfig\s+signingConfigs\.\w+", release_body):
              release_body = re.sub(
                  r"signingConfig\s+signingConfigs\.\w+",
                  replacement,
                  release_body,
                  count=1,
              )
          else:
              release_body = "\n        " + replacement + release_body

          text = text[:rel_open + 1] + release_body + text[rel_close:]
          gradle.write_text(text)

          # Re-read and prove the release block now uses release signing, never debug signing.
          verify = gradle.read_text()
          bt = re.search(r"\bbuildTypes\s*\{", verify)
          bt_open, bt_close = block_bounds(verify, bt.start())
          bt_body = verify[bt_open + 1:bt_close]
          rel = re.search(r"\brelease\s*\{", bt_body)
          rel_abs_start = bt_open + 1 + rel.start()
          rel_open, rel_close = block_bounds(verify, rel_abs_start)
          final_release = verify[rel_open + 1:rel_close]
          if "signingConfig signingConfigs.release" not in final_release:
              raise SystemExit("release signingConfig was not wired")
          if "signingConfig signingConfigs.debug" in final_release:
              raise SystemExit("release build still references debug signingConfig")
          print("release buildType is wired to signingConfigs.release")
          PY

      - name: Build signed release AAB
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed AAB
        working-directory: frontend/android
        run: |
          set -euo pipefail
          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$aab"
          size=$(stat -c%s "$aab")
          sha=$(sha256sum "$aab" | awk '{print $1}')
          echo "AAB: $aab"
          echo "Size: $size bytes"
          echo "SHA-256: $sha"

          cert_info="$(keytool -printcert -jarfile "$aab")"
          actual_sha1="$(printf '%s\n' "$cert_info" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n1 | tr -d '[:space:]')"
          owner="$(printf '%s\n' "$cert_info" | sed -n 's/^Owner:[[:space:]]*//p' | head -n1)"
          echo "Built AAB certificate owner: $owner"
          echo "Expected Play upload SHA1:  $EXPECTED_PLAY_UPLOAD_SHA1"
          echo "Built AAB SHA1:             $actual_sha1"
          test -n "$actual_sha1"
          if [ "$actual_sha1" != "$EXPECTED_PLAY_UPLOAD_SHA1" ]; then
            echo "ERROR: built AAB is not signed with the Google Play registered upload certificate."
            exit 1
          fi

          curl -sSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          java -jar /tmp/bundletool.jar validate --bundle="$aab"
          unzip -p "$aab" BundleConfig.pb > /dev/null
          java -jar /tmp/bundletool.jar dump manifest --bundle="$aab" | tee /tmp/aab-manifest.xml
          grep -F 'package="com.trackmyrmc.concreteking"' /tmp/aab-manifest.xml
          grep -F 'android:versionCode="80"' /tmp/aab-manifest.xml
          grep -F 'android:versionName="2.0.22"' /tmp/aab-manifest.xml
          echo "AAB certificate MATCHES Google Play upload key."

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackmyrmc-v2.0.22-vc80-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
