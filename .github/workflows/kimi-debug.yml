name: Kimi K3 Debug Assistant

on:
  push:
    branches:
      - feat/kimi-k3-agent
    paths:
      - ".github/workflows/kimi-debug.yml"

  workflow_dispatch:
    inputs:
      file_path:
        description: "Repository file for Kimi to analyze"
        required: true
        default: "README.md"

      task:
        description: "What should Kimi investigate?"
        required: true
        default: "Review this file and identify bugs, risks, and improvements."

permissions:
  contents: read

jobs:
  kimi-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze file with Kimi K3
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
          KIMI_FILE: ${{ github.event.inputs.file_path || 'README.md' }}
          KIMI_TASK: ${{ github.event.inputs.task || 'Review this file. Identify architecture, code-quality, security, and debugging concerns. Do not modify anything.' }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          import urllib.error

          api_key = os.environ.get("NVIDIA_API_KEY")
          model = os.environ.get("KIMI_MODEL")
          file_name = os.environ.get("KIMI_FILE", "README.md")
          task = os.environ.get("KIMI_TASK", "Review this file.")

          if not api_key:
              raise SystemExit("NVIDIA_API_KEY is missing")

          if not model:
              raise SystemExit("KIMI_MODEL is missing")

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          target = (workspace / file_name).resolve()

          try:
              target.relative_to(workspace)
          except ValueError:
              raise SystemExit("Blocked: file must be inside the repository")

          blocked = [
              ".env",
              "secret",
              "credentials",
              ".pem",
              ".p12",
              ".jks",
              "keystore",
              "google-services.json"
          ]

          lower_path = str(target).lower()

          if any(item in lower_path for item in blocked):
              raise SystemExit("Blocked: potentially sensitive file")

          if not target.is_file():
              raise SystemExit(f"File not found: {file_name}")

          if target.stat().st_size > 100_000:
              raise SystemExit("File too large for this safe test")

          content = target.read_text(
              encoding="utf-8",
              errors="replace"
          )

          system_prompt = """
          You are the TrackMyRMC engineering debugging assistant.

          Rules:
          - Analyze only the code/content supplied.
          - Never claim you inspected files that were not provided.
          - Find root causes before suggesting fixes.
          - Separate confirmed findings from assumptions.
          - Do not expose or request secrets.
          - Prefer minimal production-safe changes.
          - Do not claim tests passed unless actual test evidence is supplied.
          - Do not modify code.
          """

          user_prompt = f"""
          TASK:
          {task}

          FILE:
          {file_name}

          CONTENT:
          --- BEGIN FILE ---
          {content}
          --- END FILE ---

          Return:

          ## Summary
          ## Confirmed Findings
          ## Possible Bugs
          ## Security / Reliability Risks
          ## Recommended Fixes
          ## Tests To Run
          """

          payload = {
              "model": model,
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "temperature": 0.2,
              "reasoning_effort": "high",
              "max_tokens": 4000,
              "stream": False
          }

          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"Kimi API request failed: HTTP {exc.code}\n{body[:1000]}"
              )

          try:
              answer = result["choices"][0]["message"]["content"]
          except Exception:
              raise SystemExit(
                  "Unexpected Kimi response format"
              )

          if not answer:
              raise SystemExit("Kimi returned an empty response")

          output = pathlib.Path("kimi-analysis.md")
          output.write_text(answer, encoding="utf-8")

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as fh:
                  fh.write("# Kimi K3 Debug Analysis\n\n")
                  fh.write(f"**File:** `{file_name}`\n\n")
                  fh.write(answer)
                  fh.write("\n")

          print("Kimi analysis completed successfully.")
          PY
