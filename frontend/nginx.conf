server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lightweight container health check that does not depend on Mongo/API state.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep the existing production API and Play-policy/deep-link endpoints behind
    # the canonical website host when the frontend becomes the domain origin.
    location = /api {
        proxy_pass https://tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header Host tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass https://tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header Host tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ~ ^/(health|privacy_policy|terms|account-deletion|kyc/return|\.well-known/assetlinks\.json)$ {
        proxy_pass https://tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header Host tracking-preview-api-224495133432.asia-south1.run.app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Expo's hashed bundles are immutable and safe to cache aggressively.
    location /_expo/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Expo Router web output is a single-page application. Unknown client routes
    # must fall back to index.html so role dashboards survive refresh/deep links.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
